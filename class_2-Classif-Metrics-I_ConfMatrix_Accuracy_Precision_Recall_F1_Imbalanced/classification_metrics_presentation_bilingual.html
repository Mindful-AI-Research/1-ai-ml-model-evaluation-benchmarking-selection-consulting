<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classification Metrics I | Class 13</title>
<style>
:root{--bg:#0f172a;--panel:#112a3a;--panel2:#123445;--text:#f8fafc;--muted:#b8c7d9;--teal:#2dd4bf;--green:#34d399;--line:#24536a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 82% 8%,#134e4a 0,transparent 27%),radial-gradient(circle at 6% 95%,#123445 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}.app{min-height:100vh;padding:clamp(20px,4vw,58px);display:flex;flex-direction:column}.slide{max-width:1160px;width:100%;margin:auto;display:grid;gap:22px;align-content:center;flex:1}.eyebrow{color:var(--teal);font-family:Arial,Helvetica,sans-serif;font-size:.78rem;letter-spacing:.15em;font-weight:800;text-transform:uppercase}.title{font-family:Arial,Helvetica,sans-serif;font-size:clamp(2.15rem,5.5vw,5.25rem);font-weight:700;line-height:1.07;letter-spacing:.015em;word-spacing:.08em;margin:0;max-width:1100px}.subtitle{font-size:clamp(1rem,2vw,1.35rem);line-height:1.55;color:var(--muted);max-width:860px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(145deg,rgba(18,52,69,.92),rgba(16,31,47,.87));border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2vw,28px);box-shadow:0 18px 60px rgba(0,0,0,.24)}.card h3{margin:0 0 10px;color:var(--teal);font-size:1.05rem}.card p{color:var(--muted);line-height:1.5;margin:0}.metric{font-size:clamp(1.8rem,3vw,3.15rem);font-weight:850;letter-spacing:-.025em;margin:3px 0 6px}.formula{margin-top:12px;color:#c7fbf0;font-family:Consolas,monospace;font-size:.95rem;overflow:auto}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.node{background:#124050;border:1px solid #0f766e;border-radius:12px;padding:13px 15px;color:#e9fffb;font-weight:750}.arrow{font-size:1.35rem;color:var(--teal)}table{width:100%;border-collapse:collapse;background:rgba(16,31,47,.74);border:1px solid var(--line);border-radius:14px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--teal);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}td{color:var(--muted)}tr:last-child td{border:0}.good{color:var(--green)}.risk{color:#fda4af}.footer{display:flex;align-items:center;gap:12px;padding-top:16px;color:var(--muted);font-size:.85rem}.progress{height:4px;flex:1;max-width:220px;background:#163547;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .25s}.controls{display:flex;gap:8px}.button{min-width:44px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(16,31,47,.94);color:var(--text);cursor:pointer;font-size:1.05rem;padding:0 13px}.button:hover{border-color:var(--teal);color:var(--teal)}.button.primary{border-color:#0f766e;background:#124050}.language{display:flex;gap:6px}.language .button.active{background:#0f766e;border-color:#2dd4bf;color:#fff}.hint{font-size:.78rem}@media(max-width:760px){.app{padding:24px 18px}.title{font-size:clamp(2rem,10vw,3.45rem);line-height:1.12;letter-spacing:.01em}.grid,.grid.three{grid-template-columns:1fr}.footer{gap:8px;flex-wrap:wrap}.hint{display:none}.progress{order:4;min-width:100%;max-width:none}th,td{padding:9px;font-size:.77rem}}
</style></head><body><div id="app"></div><script>
const en=[
['Class 13 · Model Evaluation','Classification Metrics I','Confusion matrices, accuracy, precision, recall, F1, class imbalance, and threshold decisions through metabolic-risk screening.',`<div class="grid three"><section class="card"><h3>Task</h3><p>Detect high metabolic risk as the positive class.</p></section><section class="card"><h3>Core idea</h3><p>A single score cannot reveal every kind of error.</p></section><section class="card"><h3>Lab stack</h3><p>Python · pandas · matplotlib · scikit-learn</p></section></div>`],
['The learning problem','What are we evaluating?','A binary classifier compares its prediction with the true label for each patient.',`<div class="grid"><section class="card"><h3>Positive class</h3><p>High metabolic risk (<code>alto_risco = 1</code>). The supplied materials report 128 of 850 records, roughly 15%.</p></section><section class="card"><h3>Why it matters</h3><p>With a minority positive class, overall accuracy can look strong even when relevant cases are missed.</p></section></div>`],
['The foundation','The confusion matrix','Every core binary-classification metric is built from four outcomes.',`<div class="grid"><section class="card"><h3>Correct decisions</h3><p>True Negative (TN): predicted not high risk and actually not high risk. True Positive (TP): predicted high risk and actually high risk.</p></section><section class="card"><h3>Errors</h3><p>False Positive (FP): a false alarm. False Negative (FN): a high-risk patient classified as not high risk.</p></section></div>`],
['Metric definitions','Each metric asks a different question','The denominator determines what kind of mistake the metric exposes.',`<div class="grid"><section class="card"><h3>Accuracy</h3><p>Of all evaluated cases, how many predictions were correct?</p><div class="formula">(TP + TN) / (TP + TN + FP + FN)</div></section><section class="card"><h3>Precision</h3><p>Of the cases flagged positive, how many were truly positive?</p><div class="formula">TP / (TP + FP)</div></section><section class="card"><h3>Recall</h3><p>Of all actual positives, how many did we find?</p><div class="formula">TP / (TP + FN)</div></section><section class="card"><h3>F1 score</h3><p>A harmonic mean that is high only when both precision and recall are high.</p><div class="formula">2 × (P × R) / (P + R)</div></section></div>`],
['Implemented workflow','From data to interpretation','The lab uses a stratified 70/30 split and a depth-limited decision tree.',`<div class="flow"><div class="node">Patient CSV</div><div class="arrow">→</div><div class="node">Binary target</div><div class="arrow">→</div><div class="node">One-hot encode sex</div><div class="arrow">→</div><div class="node">Stratified split</div><div class="arrow">→</div><div class="node">Decision tree</div><div class="arrow">→</div><div class="node">Metrics</div></div>`],
['Default decision threshold','Observed tree results','Demonstrated outputs from the supplied class test split; not clinical-validation results.',`<div class="grid three"><section class="card"><h3>Confusion matrix</h3><p>TN 205 · FP 12 · FN 22 · TP 16</p></section><section class="card"><h3>Accuracy</h3><div class="metric">0.867</div><p>221 correct classifications out of 255.</p></section><section class="card"><h3>Positive recall</h3><div class="metric">0.421</div><p>16 of 38 high-risk cases detected.</p></section><section class="card"><h3>Positive precision</h3><div class="metric">0.571</div><p>16 of 28 flagged cases were high risk.</p></section><section class="card"><h3>Positive F1</h3><div class="metric">0.485</div><p>Balance of precision and recall.</p></section><section class="card"><h3>Specificity</h3><div class="metric">0.945</div><p>Most negative cases were correctly identified.</p></section></div>`],
['Imbalance','The accuracy trap','A dummy classifier that always chooses the majority class can still look accurate.',`<table><thead><tr><th>Model</th><th>Accuracy</th><th>Positive recall</th><th>Meaning</th></tr></thead><tbody><tr><td>Dummy majority classifier</td><td>0.851</td><td class="risk">0.000</td><td>Detects no high-risk patients.</td></tr><tr><td>Decision tree</td><td>0.867</td><td class="good">0.421</td><td>Detects some positive cases.</td></tr></tbody></table>`],
['Decision policy','Thresholds create a trade-off','The model provides probabilities; the threshold converts them into a decision.',`<table><thead><tr><th>Threshold</th><th>Recall</th><th>Precision</th><th>Interpretation</th></tr></thead><tbody><tr><td>0.50</td><td>0.42</td><td>0.57</td><td>Default cutoff shown in class</td></tr><tr><td>0.30</td><td>0.61</td><td>0.47</td><td>Finds more positives; more false alarms</td></tr><tr><td>0.20</td><td>0.61</td><td>0.47</td><td>Same demonstrated result for this tree</td></tr><tr><td>0.70</td><td>0.39</td><td>0.65</td><td>More conservative positive calls</td></tr></tbody></table>`],
['Evaluation discipline','Choose on validation, measure once on test','Threshold tuning is a decision. Choosing it after repeated test-set inspection compromises the final evaluation.',`<div class="grid"><section class="card"><h3>When FN is costly</h3><p>Prioritize recall. In screening, missing a positive case may be more harmful than an additional follow-up.</p></section><section class="card"><h3>When FP is costly</h3><p>Prioritize precision when false alarms create unacceptable cost or harm.</p></section></div>`],
['Responsible interpretation','What the lab does not establish','The materials demonstrate evaluation concepts—not a deployable health system.',`<div class="grid"><section class="card"><h3>Not provided</h3><p>External validation, confidence intervals, calibration, subgroup fairness evaluation, privacy assessment, deployment, and clinical validation.</p></section><section class="card"><h3>Recommended next steps</h3><p>Use validation or cross-validation, study ROC/PR curves and calibration, measure subgroup performance, and apply governance before real-world health use.</p></section></div>`],
['Key takeaway','Evaluation is error-aware decision making','Accuracy alone can hide the failure that matters most. A confusion matrix, class-aware metrics, and a threshold tied to error cost make assessment more credible.',`<section class="card"><h3>Class outcome</h3><p>The implemented notebook offers a reproducible foundation for later work on validation, model selection, calibration, and responsible ML evaluation.</p></section>`]
];
const pt=[
['Aula 13 · Avaliação de Modelos','Métricas de Classificação I','Matriz de confusão, acurácia, precisão, recall, F1, desbalanceamento de classes e decisões por limiar na triagem de risco metabólico.',`<div class="grid three"><section class="card"><h3>Tarefa</h3><p>Detectar alto risco metabólico como a classe positiva.</p></section><section class="card"><h3>Ideia central</h3><p>Uma única métrica não revela todos os tipos de erro.</p></section><section class="card"><h3>Stack do laboratório</h3><p>Python · pandas · matplotlib · scikit-learn</p></section></div>`],
['O problema de aprendizado','O que estamos avaliando?','Um classificador binário compara sua previsão com o rótulo verdadeiro de cada paciente.',`<div class="grid"><section class="card"><h3>Classe positiva</h3><p>Alto risco metabólico (<code>alto_risco = 1</code>). Os materiais fornecidos informam 128 registros em 850, aproximadamente 15%.</p></section><section class="card"><h3>Por que importa</h3><p>Com uma classe positiva minoritária, a acurácia geral pode parecer alta mesmo quando casos relevantes são perdidos.</p></section></div>`],
['A base','A matriz de confusão','Todas as métricas centrais de classificação binária são construídas a partir de quatro resultados.',`<div class="grid"><section class="card"><h3>Decisões corretas</h3><p>Verdadeiro Negativo (VN): previu sem alto risco e o paciente realmente não tinha alto risco. Verdadeiro Positivo (VP): previu alto risco e o paciente realmente tinha alto risco.</p></section><section class="card"><h3>Erros</h3><p>Falso Positivo (FP): um falso alarme. Falso Negativo (FN): um paciente de alto risco classificado como sem alto risco.</p></section></div>`],
['Definições das métricas','Cada métrica responde uma pergunta','O denominador define qual tipo de erro a métrica evidencia.',`<div class="grid"><section class="card"><h3>Acurácia</h3><p>De todos os casos avaliados, quantas previsões estavam corretas?</p><div class="formula">(VP + VN) / (VP + VN + FP + FN)</div></section><section class="card"><h3>Precisão</h3><p>Dos casos sinalizados como positivos, quantos eram realmente positivos?</p><div class="formula">VP / (VP + FP)</div></section><section class="card"><h3>Recall</h3><p>De todos os positivos reais, quantos foram encontrados?</p><div class="formula">VP / (VP + FN)</div></section><section class="card"><h3>F1-score</h3><p>Média harmônica que só é alta quando precisão e recall também são altos.</p><div class="formula">2 × (P × R) / (P + R)</div></section></div>`],
['Fluxo implementado','Dos dados à interpretação','O laboratório usa divisão estratificada 70/30 e uma árvore de decisão com profundidade limitada.',`<div class="flow"><div class="node">CSV de pacientes</div><div class="arrow">→</div><div class="node">Alvo binário</div><div class="arrow">→</div><div class="node">Codificar sexo</div><div class="arrow">→</div><div class="node">Divisão estratificada</div><div class="arrow">→</div><div class="node">Árvore de decisão</div><div class="arrow">→</div><div class="node">Métricas</div></div>`],
['Limiar de decisão padrão','Resultados observados da árvore','Saídas demonstradas no conjunto de teste da aula; não são resultados de validação clínica.',`<div class="grid three"><section class="card"><h3>Matriz de confusão</h3><p>VN 205 · FP 12 · FN 22 · VP 16</p></section><section class="card"><h3>Acurácia</h3><div class="metric">0.867</div><p>221 classificações corretas em 255.</p></section><section class="card"><h3>Recall positivo</h3><div class="metric">0.421</div><p>16 de 38 casos de alto risco detectados.</p></section><section class="card"><h3>Precisão positiva</h3><div class="metric">0.571</div><p>16 dos 28 casos sinalizados eram alto risco.</p></section><section class="card"><h3>F1 positivo</h3><div class="metric">0.485</div><p>Equilíbrio entre precisão e recall.</p></section><section class="card"><h3>Especificidade</h3><div class="metric">0.945</div><p>A maior parte dos negativos foi identificada corretamente.</p></section></div>`],
['Desbalanceamento','A armadilha da acurácia','Um classificador dummy que sempre escolhe a classe majoritária ainda pode parecer preciso.',`<table><thead><tr><th>Modelo</th><th>Acurácia</th><th>Recall positivo</th><th>Significado</th></tr></thead><tbody><tr><td>Dummy da classe majoritária</td><td>0.851</td><td class="risk">0.000</td><td>Não detecta nenhum paciente de alto risco.</td></tr><tr><td>Árvore de decisão</td><td>0.867</td><td class="good">0.421</td><td>Detecta alguns casos positivos.</td></tr></tbody></table>`],
['Política de decisão','Limiares criam um trade-off','O modelo fornece probabilidades; o limiar as transforma em uma decisão.',`<table><thead><tr><th>Limiar</th><th>Recall</th><th>Precisão</th><th>Interpretação</th></tr></thead><tbody><tr><td>0.50</td><td>0.42</td><td>0.57</td><td>Corte padrão demonstrado na aula</td></tr><tr><td>0.30</td><td>0.61</td><td>0.47</td><td>Encontra mais positivos; gera mais falsos alarmes</td></tr><tr><td>0.20</td><td>0.61</td><td>0.47</td><td>Mesmo resultado demonstrado para esta árvore</td></tr><tr><td>0.70</td><td>0.39</td><td>0.65</td><td>Previsões positivas mais conservadoras</td></tr></tbody></table>`],
['Disciplina de avaliação','Escolha na validação; meça uma vez no teste','Ajustar o limiar é uma decisão. Escolhê-lo após inspecionar repetidamente o teste compromete a avaliação final.',`<div class="grid"><section class="card"><h3>Quando FN é caro</h3><p>Priorize recall. Em triagem, deixar de detectar um caso positivo pode ser mais prejudicial que uma avaliação adicional.</p></section><section class="card"><h3>Quando FP é caro</h3><p>Priorize precisão quando falsos alarmes criam custo ou dano inaceitável.</p></section></div>`],
['Interpretação responsável','O que o laboratório não demonstra','Os materiais ensinam conceitos de avaliação — não um sistema de saúde pronto para implantação.',`<div class="grid"><section class="card"><h3>Não fornecido</h3><p>Validação externa, intervalos de confiança, calibração, avaliação de equidade por subgrupos, privacidade, implantação e validação clínica.</p></section><section class="card"><h3>Próximos passos recomendados</h3><p>Usar validação ou validação cruzada, estudar curvas ROC/PR e calibração, medir desempenho por subgrupos e aplicar governança antes de uso real em saúde.</p></section></div>`],
['Ideia principal','Avaliar é tomar decisões conscientes sobre erros','A acurácia sozinha pode esconder a falha mais importante. Matriz de confusão, métricas por classe e limiar ligado ao custo do erro tornam a avaliação mais confiável.',`<section class="card"><h3>Resultado da aula</h3><p>O notebook implementado oferece uma base reproduzível para validação, seleção de modelos, calibração e avaliação responsável de ML.</p></section>`]
];
let lang='en',i=0,downX=0;function labels(){return lang==='en'?{next:'Next →',prev:'←',hint:'Use buttons, arrow keys, or swipe'}:{next:'Próximo →',prev:'←',hint:'Use os botões, setas do teclado ou deslize'}}function draw(){let s=(lang==='en'?en:pt)[i],p=((i+1)/en.length*100).toFixed(1),l=labels();document.documentElement.lang=lang;document.getElementById('app').innerHTML='<main class="app"><article class="slide"><div class="eyebrow">'+s[0]+'</div><h1 class="title">'+s[1]+'</h1><p class="subtitle">'+s[2]+'</p>'+s[3]+'</article><footer class="footer"><span class="hint">'+l.hint+'</span><button class="button" onclick="prevSlide()" aria-label="Previous slide">'+l.prev+'</button><button class="button primary" onclick="nextSlide()" aria-label="Next slide">'+l.next+'</button><div class="progress"><span style="width:'+p+'%"></span></div><span>'+ (i+1)+' / '+en.length+'</span><div class="language"><button class="button '+(lang==='en'?'active':'')+'" onclick="setLanguage(\'en\')" title="English">🇬🇧</button><button class="button '+(lang==='pt'?'active':'')+'" onclick="setLanguage(\'pt\')" title="Português do Brasil">🇧🇷</button></div><div class="controls"><button class="button" onclick="restart()" title="Return to start">↺</button><button class="button" onclick="fullscreen()" title="Fullscreen">⛶</button></div></footer></main>'}function setLanguage(value){lang=value;draw()}function nextSlide(){i=(i+1)%en.length;draw()}function prevSlide(){i=(i-1+en.length)%en.length;draw()}function restart(){i=0;draw()}function fullscreen(){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')nextSlide();else if(e.key==='ArrowLeft'||e.key==='PageUp')prevSlide();else if(e.key==='Home')restart()});document.addEventListener('touchstart',e=>downX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-downX;if(Math.abs(d)>40)d<0?nextSlide():prevSlide()},{passive:true});draw();
</script></body></html>
