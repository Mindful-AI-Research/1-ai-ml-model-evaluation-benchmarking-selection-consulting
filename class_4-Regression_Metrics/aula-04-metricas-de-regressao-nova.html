<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Regression Metrics · Aula 04</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0B0B0C;--panel:#0F172A;--blue:#123E7A;--cyan:#06B6D4;--aqua:#22D3EE;--white:#fff;--muted:#b6c2d4;--line:#22d3ee33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Manrope,Inter,system-ui,sans-serif}.app{min-height:100dvh;background:radial-gradient(circle at 78% 10%,#123e7a80,transparent 34%),radial-gradient(circle at 10% 90%,#06b6d430,transparent 38%),var(--bg);display:flex;flex-direction:column}.top{padding:16px clamp(18px,5vw,72px);display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line)}.brand{font:600 12px 'JetBrains Mono';letter-spacing:.08em;color:var(--aqua)}.langs{display:flex;gap:8px;flex-wrap:wrap}.lang{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#0f172ad9;color:#d8e6f7;font:600 13px Manrope;cursor:pointer}.lang.active{background:var(--cyan);border-color:var(--cyan);color:#06141b}.main{width:min(1160px,100%);margin:auto;padding:clamp(28px,6vw,78px) clamp(18px,5vw,72px);flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:26px}.eyebrow{font:600 12px 'JetBrains Mono';letter-spacing:.13em;color:var(--aqua);text-transform:uppercase}h1{font-size:clamp(38px,6vw,78px);line-height:1;letter-spacing:-.065em;margin:10px 0 0;max-width:12ch}.accent{color:var(--aqua)}.subtitle{color:var(--muted);font-size:clamp(17px,2vw,23px);max-width:720px;line-height:1.5;margin:18px 0 0}.body{align-self:center}.card{background:linear-gradient(145deg,#0f172aec,#0f172ab8);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:0 18px 45px #0004}.formula{font:600 clamp(20px,3vw,36px) 'JetBrains Mono';color:var(--aqua);text-align:center;line-height:1.45}.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font:700 clamp(30px,4vw,54px) 'JetBrains Mono';color:var(--aqua)}h3{margin:7px 0;font-size:20px}.text{color:var(--muted);font-size:clamp(15px,1.65vw,20px);line-height:1.55;white-space:pre-line}.tag{font:600 11px 'JetBrains Mono';color:var(--aqua);letter-spacing:.1em}.table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px var(--line);font-size:clamp(13px,1.5vw,18px)}th,td{padding:12px 14px;border:1px solid var(--line);text-align:left}th{background:var(--blue)}td:last-child{font-family:'JetBrains Mono';color:var(--aqua)}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}.navbtn{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#fff;padding:14px 19px;cursor:pointer;font:700 14px Manrope;min-width:125px}.navbtn.primary{background:var(--cyan);border-color:var(--cyan);color:#06141b}.navbtn:disabled{opacity:.36;cursor:not-allowed}.counter{color:var(--muted);font:600 12px 'JetBrains Mono'}.progress{height:4px;background:#ffffff16;position:relative}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--aqua));transition:width .25s}.hint{text-align:center;color:#7d91a8;font:12px 'JetBrains Mono';padding:0 20px 16px}.hidden{display:none}@media(max-width:700px){.two,.three{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.navbtn{min-width:110px;padding:13px 14px}h1{font-size:43px}.main{min-height:calc(100dvh - 115px)}}@media(prefers-reduced-motion:no-preference){.body{animation:show .28s ease}@keyframes show{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}}</style></head><body><div {e:'Consultoria Especializada em Ciência de Dados 1 · 25/08/2026',t:['Métricas de <span class="accent">Regressão</span>','Regression <span class="accent">Metrics</span>'],s:['Como medir a distância entre uma previsão numérica e o valor real.','How to measure the distance between a numeric prediction and the real value.'],b:'<div class="card"><div class="metric">MAE · RMSE · R² · MAPE</div><p class="text">Erro em unidades · comparação com baseline · erro percentual · diagnóstico de resíduos</p></div>'},
{e:'Objetivo',t:['A pergunta mudou: <span class="accent">quão longe?</span>','The question changed: <span class="accent">how far?</span>'],s:['Em regressão, o modelo prevê um número contínuo, como o tempo de entrega.','In regression, the model predicts a continuous number, such as delivery time.'],b:'<div class="grid three"><div class="card"><div class="metric">e</div><h3>Erro / Error</h3></div><div class="card"><div class="metric">MAE</div><h3>Erro típico / Typical error</h3></div><div class="card"><div class="metric">R²</div><h3>Baseline</h3></div></div>'},
{e:'Conceito',t:['Todo cálculo começa<br>com o <span class="accent">erro</span>.','Every calculation starts<br>with an <span class="accent">error</span>.'],s:['O sinal mostra a direção; a magnitude mostra a distância.','The sign shows direction; magnitude shows distance.'],b:'<div class="card formula">erro = valor real − valor previsto</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="tag">ERRO POSITIVO / POSITIVE ERROR</div><h3>Subestimou / Underestimated</h3><p class="text">O real foi maior que a previsão.</p></div><div class="card"><div class="tag">ERRO NEGATIVO / NEGATIVE ERROR</div><h3>Superestimou / Overestimated</h3><p class="text">O real foi menor que a previsão.</p></div></div>'},
{e:'Exemplo demonstrado',t:['Cinco pedidos.<br>Um <span class="accent">grande atraso</span>.','Five orders.<br>One <span class="accent">large delay</span>.'],s:['O pedido #5 teve atraso de 44 minutos porque a moto quebrou.','Order #5 was 44 minutes late because the motorcycle broke down.'],b:'<table class="table"><thead><tr><th>Pedido / Order</th><th>Previsto / Predicted</th><th>Real / Actual</th><th>Erro / Error</th></tr></thead><tbody><tr><td>#1</td><td>30 min</td><td>35 min</td><td>+5</td></tr><tr><td>#2</td><td>25 min</td><td>22 min</td><td>−3</td></tr><tr><td>#3</td><td>40 min</td><td>38 min</td><td>−2</td></tr><tr><td>#4</td><td>20 min</td><td>26 min</td><td>+6</td></tr><tr><td>#5</td><td>30 min</td><td>74 min</td><td>+44</td></tr></tbody></table>'},
{e:'MAE',t:['Erro típico<br>em <span class="accent">minutos</span>.','Typical error<br>in <span class="accent">minutes</span>.'],s:['O MAE usa os valores absolutos: cada erro entra proporcionalmente.','MAE uses absolute values: each error contributes proportionally.'],b:'<div class="grid two"><div class="card formula">MAE = média de |real − previsto|</div><div class="card"><div class="metric">12 min</div><p class="text">5 + 3 + 2 + 6 + 44 = 60<br>60 ÷ 5 = 12</p></div></div>'},
{e:'RMSE',t:['Quando o atraso enorme<br>precisa <span class="accent">pesar mais</span>.','When a huge delay<br>must <span class="accent">matter more</span>.'],s:['Elevar ao quadrado amplifica os grandes erros; a raiz final devolve a unidade para minutos.','Squaring magnifies large errors; the final root restores the unit to minutes.'],b:'<div class="grid two"><div class="card formula">RMSE = raiz da média dos erros²</div><div class="card"><div class="metric">44² = 1936</div><p class="text">No exemplo demonstrado:<br>RMSE ≈ 20 min · MAE = 12 min</p></div></div>'},
{e:'Comparação',t:['MAE × RMSE:<br>mesma unidade, <span class="accent">foco diferente</span>.','MAE × RMSE:<br>same unit, <span class="accent">different focus</span>.'],s:['O RMSE é sempre maior ou igual ao MAE. Uma diferença maior indica erros muito grandes.','RMSE is always greater than or equal to MAE. A wider gap indicates very large errors.'],b:'<div class="grid two"><div class="card"><div class="metric">MAE = 12</div><h3>Erro típico / Typical error</h3></div><div class="card"><div class="metric">RMSE ≈ 20</div><h3>Sensível a outliers / Outlier-sensitive</h3></div></div>'},
{e:'R²',t:['Melhor que prever<br>sempre a <span class="accent">média?</span>','Better than always<br>predicting the <span class="accent">mean?</span>'],s:['O R² compara o modelo com o baseline de prever a média para todos os casos.','R² compares the model with a baseline that predicts the mean for every case.'],b:'<div class="card formula">R² = 1 − (soma dos erros² ÷ soma dos desvios²)</div><div class="grid three" style="margin-top:16px"><div class="card"><div class="metric">1.0</div><h3>Perfeito / Perfect</h3></div><div class="card"><div class="metric">0</div><h3>Igual ao baseline / Same as baseline</h3></div><div class="card"><div class="metric">&lt; 0</div><h3>Pior que baseline / Worse</h3></div></div>'},
{e:'R² demonstrado',t:['Um R² negativo é<br>um <span class="accent">alerta</span>.','A negative R² is<br>a <span class="accent">warning</span>.'],s:['Neste exemplo, prever a média de 39 minutos é melhor que o modelo.','In this example, predicting the 39-minute mean is better than the model.'],b:'<div class="grid two"><div class="card"><div class="tag">SOMA DOS ERROS² / SUM OF ERRORS²</div><div class="metric">2010</div></div><div class="card"><div class="tag">SOMA DOS DESVIOS² / SUM OF DEVIATIONS²</div><div class="metric">1700</div></div></div><div class="card formula" style="margin-top:16px">R² = 1 − 2010 ÷ 1700 = −0,18</div>'},
{e:'MAPE',t:['Erro em <span class="accent">porcentagem</span>.<br>Com uma armadilha.','Error in <span class="accent">percentage</span>.<br>With a trap.'],s:['O MAPE divide pelo valor real. Valores próximos de zero podem gerar percentuais enormes.','MAPE divides by the actual value. Values close to zero can create enormous percentages.'],b:'<div class="grid two"><div class="card formula">MAPE = média de (|erro| ÷ real) × 100%</div><div class="card"><div class="metric">5 / 35 = 14%</div><p class="text">Se real = 5 e erro = 5, então MAPE = 100%.</p></div></div>'},
{e:'Resíduos',t:['A métrica resume.<br>O gráfico <span class="accent">explica</span>.','The metric summarizes.<br>The plot <span class="accent">explains</span>.'],s:['Inspecione os padrões dos erros em torno de zero.','Inspect error patterns around zero.'],b:'<div class="grid two"><div class="card"><h3>Nuvem sem padrão / Pattern-free cloud</h3><p class="text">Bom sinal: desempenho parecido em valores menores e maiores.</p></div><div class="card"><h3>Funil / Funnel</h3><p class="text">A variância do erro aumenta para previsões maiores.</p></div><div class="card"><h3>Curva / Curve</h3><p class="text">Erro sistemático: o modelo pode ser simples demais.</p></div><div class="card"><h3>Um lado / One side</h3><p class="text">Viés: subestimação ou superestimação recorrente.</p></div></div>'},
{e:'Escolha',t:['A métrica depende<br>do <span class="accent">custo do erro</span>.','The metric depends<br>on the <span class="accent">cost of error</span>.'],s:['Reporte quase sempre um erro em minutos junto do R².','Almost always report an error in minutes together with R².'],b:'<table class="table"><thead><tr><th>Objetivo / Goal</th><th>Métrica / Metric</th></tr></thead><tbody><tr><td>Erro típico em minutos / Typical minutes</td><td>MAE</td></tr><tr><td>Punir atrasos grandes / Penalize large delays</td><td>RMSE</td></tr><tr><td>Melhor que a média / Better than mean</td><td>R²</td></tr><tr><td>Erro percentual / Percentage error</td><td>MAPE</td></tr></tbody></table>'},
{e:'Boas práticas',t:['Avalie com <span class="accent">contexto</span>.','Evaluate with <span class="accent">context</span>.'],s:['Use métricas e resíduos juntos; uma única pontuação não mostra todo o comportamento do modelo.','Use metrics and residuals together; one score does not show all model behavior.'],b:'<div class="grid two"><div class="card"><div class="tag">EVITE / AVOID</div><p class="text">• Reportar só R²<br>• MAPE perto de zero<br>• Ignorar resíduos<br>• Comparar MAE/RMSE entre escalas incompatíveis</p></div><div class="card"><div class="tag">RECOMENDADO / RECOMMENDED</div><p class="text">• MAE ou RMSE + R²<br>• Inspecionar erros<br>• Escolher pela consequência<br>• Validar antes de testar</p></div></div>'}
];let n=0,L='pt';const q=id=>document.getElementById(id);function render(){let x=S[n],k=L==='pt'?0:1;q('eyebrow').textContent=x.e;q('title').innerHTML=x.t[k];q('subtitle').textContent=x.s[k];q('body').innerHTML=x.b;q('counter').textContent=`${String(n+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`;q('prev').disabled=n===0;q('next').disabled=n===S.length-1;q('prevText').textContent=L==='pt'?'Anterior':'Previous';q('nextText').textContent=L==='pt'?'Próximo':'Next';q('hint').textContent=L==='pt'?'Use os botões, ← → no teclado, ou deslize na tela.':'Use the buttons, keyboard ← →, or swipe the screen.';q('bar').style.width=((n+1)/S.length*100)+'%';document.documentElement.lang=L==='pt'?'pt-BR':'en'}q('prev').onclick=()=>{if(n){n--;render()}};q('next').onclick=()=>{if(n<S.length-1){n++;render()}};document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{L=b.dataset.lang;document.querySelectorAll('.lang').forEach(v=>v.classList.toggle('active',v===b));render()});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')q('next').click();if(e.key==='ArrowLeft')q('prev').click()});let start=0;document.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>55){d<0?q('next').click():q('prev').click()}},{passive:true});render();</script></body></html>
