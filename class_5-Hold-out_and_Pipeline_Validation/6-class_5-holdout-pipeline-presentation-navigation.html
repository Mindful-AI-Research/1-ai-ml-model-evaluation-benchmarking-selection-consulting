    .navigation { position:fixed; right:clamp(16px,4vw,52px); bottom:72px; z-index:15; display:flex; gap:10px; align-items:center; }

    @media (max-width:760px) { .grid2,.grid3 { grid-template-columns:1fr; } .split { grid-template-columns:1fr; } .split div { border-right:0; border-bottom:2px solid rgba(255,255,255,.13); } .stage { padding:91px 17px 148px; } .brand { font-size:.65rem; max-width:45vw; } .hint { display:none; } .navigation { left:16px; right:16px; bottom:70px; justify-content:space-between; } .nav-btn { min-width:0; width:calc(50% - 5px); } }

  <script>
    const en = [
      ['PUC-SP · Class 05 · 01 September 2026','Hold-Out Validation<br><span class="teal">& Leakage-Safe Pipelines</span>','How to separate data honestly, protect the final test set, and keep preprocessing from leaking information.','<div class="quote">“One portion to learn, one to choose, and one for the final judgment.”</div><div class="grid3"><div class="card"><h3>Institution</h3><p>Pontifical Catholic University of São Paulo (PUC-SP)</p></div><div class="card"><h3>Professor</h3><p>Giovani Giulio Tristão Thibes Vieira</p></div><div class="card"><h3>Programme</h3><p>BSc Human-Centered AI & Data Science · 6th Semester</p></div></div>'],
      ['Class objective','Estimate performance <span class="teal">honestly</span>','Separate data into training, validation, and test sets—and use a Pipeline so information does not leak.','<div class="grid3"><div class="card green"><h3>Learn</h3><p>Fit model parameters using training observations.</p></div><div class="card warn"><h3>Choose</h3><p>Compare candidate workflows and tune decisions on validation data.</p></div><div class="card cyan"><h3>Judge</h3><p>Use the protected test set for the final, honest measurement.</p></div></div>'],
      ['The three-way split','Three datasets. <span class="teal">Three jobs.</span>','The class example reserves 20% for test data, then splits the remaining 80% into 60% training and 20% validation.','<div class="split"><div class="train"><strong>TRAINING · 60%</strong><span>The model learns here. It can be used repeatedly for fitting.</span></div><div class="validation"><strong>VALIDATION · 20%</strong><span>Compare alternatives and choose a configuration.</span></div><div class="test"><strong>TEST · 20%</strong><span>Final judgment. Ideally opened only once.</span></div></div>'],
      ['Implementation pattern','Create the split in <span class="teal">two stages</span>','The exact 60/20/20 ratio is an illustration, not a universal rule. Protect the test set before development choices.','<pre>from sklearn.model_selection import train_test_split\n\n# 1) Protect the test set.\nX_remaining, X_test, y_remaining, y_test = train_test_split(\n    X, y, test_size=0.20, stratify=y, random_state=0\n)\n\n# 2) Split the remaining 80% into train and validation.\nX_train, X_val, y_train, y_val = train_test_split(\n    X_remaining, y_remaining, test_size=0.25,\n    stratify=y_remaining, random_state=0\n)</pre>'],
      ['Reproducible partitions','Stratify classes. Fix the <span class="teal">seed.</span>','These two options answer different problems: representativeness and repeatability.','<div class="grid2"><div class="card green"><h3><code>stratify=y</code></h3><p>Preserves the class proportion in each split. This matters when a class is rare.</p></div><div class="card cyan"><h3><code>random_state=0</code></h3><p>Fixes the random draw so the experiment can be repeated with the same partitions.</p></div></div>'],
      ['Correct selection flow','Develop here. Decide here. <span class="teal">Report here.</span>','The test set is not a development dashboard. Repeatedly consulting it makes its estimate less independent.','<div class="flow"><div class="node">1. Train candidates<br><span class="small">Training set</span></div><div class="arrow">→</div><div class="node">2. Compare and tune<br><span class="small">Validation set</span></div><div class="arrow">→</div><div class="node">3. Select workflow<br><span class="small">Final candidate</span></div><div class="arrow">→</div><div class="node">4. Confirm once<br><span class="small">Protected test set</span></div></div>'],
      ['Preprocessing leakage','A subtle mistake can make results <span class="teal">too optimistic.</span>','Fitting a scaler, imputer, or feature selector on the complete dataset allows training to “see” properties of the test set.','<div class="grid2"><div class="card bad"><h3>✕ Unsafe</h3><p>Fit transformations on the full dataset, then split training and test data.</p><div class="flow"><div class="node">Full data</div><div class="arrow">→</div><div class="node">Fit scaler<br>train + test</div><div class="arrow">→</div><div class="node">Split later</div></div></div><div class="card good"><h3>✓ Safe</h3><p>Split first. Fit transformations only on training data. Transform test data without refitting.</p><div class="flow"><div class="node">Split first</div><div class="arrow">→</div><div class="node">Fit scaler<br>train only</div><div class="arrow">→</div><div class="node">Transform test</div></div></div></div>'],
      ['fit versus transform','<span class="teal">Fit</span> learns. <span class="teal">Transform</span> applies.','A test set may receive a learned transformation, but it must not contribute to learning that transformation.','<pre>from sklearn.preprocessing import StandardScaler\n\n# UNSAFE: statistics include the test distribution.\nscaler = StandardScaler().fit(X)\n\n# SAFE: learn mean and standard deviation from training only.\nscaler = StandardScaler().fit(X_train)\nX_test_ready = scaler.transform(X_test)</pre>'],
      ['Pipeline solution','One workflow. <span class="teal">Correct order.</span>','A scikit-learn Pipeline connects preprocessing and an estimator. Calling fit on training data fits every learned step using training data only.','<div class="flow"><div class="node">Training features</div><div class="arrow">→</div><div class="node">Preprocessing<br><span class="small">fit only on train</span></div><div class="arrow">→</div><div class="node">Classifier / regressor<br><span class="small">fit only on train</span></div><div class="arrow">→</div><div class="node">Saved workflow</div></div><div class="flow"><div class="node">Test / production features</div><div class="arrow">→</div><div class="node">Same learned transformations</div><div class="arrow">→</div><div class="node">Prediction</div></div>'],
      ['ColumnTransformer + Pipeline','Different columns, <span class="teal">one safe object.</span>','The class combines numerical standardization, categorical encoding, and logistic regression in one pipeline.','<pre>from sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.linear_model import LogisticRegression\n\npreprocessor = ColumnTransformer([\n    ("num", StandardScaler(), numerical_columns),\n    ("cat", OneHotEncoder(), categorical_columns),\n])\n\nmodel = Pipeline([\n    ("prep", preprocessor),\n    ("clf", LogisticRegression()),\n])\n\nmodel.fit(X_train, y_train)\npredictions = model.predict(X_test)</pre>'],
      ['Beyond the classroom','Deployment has <span class="teal">two different risks.</span>','The same pipeline supports consistency at deployment, but monitoring remains necessary after deployment.','<div class="grid2"><div class="card warn"><h3>Train–production skew · now</h3><p>Training and production process features differently. Defense: use the same validated pipeline in both contexts.</p></div><div class="card cyan"><h3>Data drift · later</h3><p>Incoming data changes over time. Defense: monitor new data and retrain or revise the model when needed.</p></div></div>'],
      ['Hold-out variations','The split must match the <span class="teal">decision context.</span>','“Hold-out” can describe different practices. Their purpose determines the design.','<table><thead><tr><th>Scenario</th><th>Appropriate design</th><th>Why</th></tr></thead><tbody><tr><td>Standard ML task</td><td>Random hold-out, often stratified</td><td>Creates training, validation, and protected test roles.</td></tr><tr><td>Time-dependent prediction</td><td>Train on past; test on later periods</td><td>Future observations must not influence a past prediction task.</td></tr><tr><td>Product impact</td><td>Global holdout of users</td><td>Measures product improvement, not one model’s fit.</td></tr><tr><td>One unstable split</td><td>Cross-validation</td><td>Aggregates multiple splits; next class topic.</td></tr></tbody></table>'],
      ['Closing','Keep the test set <span class="teal">sealed.</span>','Learn on training data, choose on validation data, and report final performance on a protected test set.','<div class="grid3"><div class="card"><h3>Honesty</h3><p>Separate development choices from final evaluation.</p></div><div class="card"><h3>Safety</h3><p>Fit transformations only where learning is allowed.</p></div><div class="card"><h3>Reproducibility</h3><p>Use explicit splits, fixed seeds, and complete pipelines.</p></div></div><div class="quote">A model is not trustworthy just because it runs. Its evaluation process must be trustworthy too.</div>']
    ];
    const pt = [
      ['PUC-SP · Aula 05 · 01 de setembro de 2026','Validação Hold-Out<br><span class="teal">& Pipelines Sem Vazamento</span>','Como separar os dados com honestidade, proteger o conjunto de teste final e impedir que o pré-processamento vaze informação.','<div class="quote">“Uma fatia para aprender, uma para escolher e uma para o juízo final.”</div><div class="grid3"><div class="card"><h3>Instituição</h3><p>Pontifícia Universidade Católica de São Paulo (PUC-SP)</p></div><div class="card"><h3>Professor</h3><p>Giovani Giulio Tristão Thibes Vieira</p></div><div class="card"><h3>Curso</h3><p>IA Human-Centered & Data Science · 6º semestre</p></div></div>'],
      ['Objetivo da aula','Estimar desempenho com <span class="teal">honestidade</span>','Separar os dados em treino, validação e teste — e usar um Pipeline para não vazar informação.','<div class="grid3"><div class="card green"><h3>Aprender</h3><p>Ajustar os parâmetros do modelo com as observações de treino.</p></div><div class="card warn"><h3>Escolher</h3><p>Comparar fluxos candidatos e ajustar decisões nos dados de validação.</p></div><div class="card cyan"><h3>Julgar</h3><p>Usar o conjunto de teste protegido para a medição final e honesta.</p></div></div>'],
      ['A divisão em três partes','Três conjuntos. <span class="teal">Três funções.</span>','No exemplo da aula, 20% é reservado para teste; os 80% restantes são divididos em 60% para treino e 20% para validação.','<div class="split"><div class="train"><strong>TREINO · 60%</strong><span>O modelo aprende aqui. Pode ser usado repetidamente no ajuste.</span></div><div class="validation"><strong>VALIDAÇÃO · 20%</strong><span>Compara alternativas e escolhe uma configuração.</span></div><div class="test"><strong>TESTE · 20%</strong><span>Juízo final. Idealmente é aberto uma única vez.</span></div></div>'],
      ['Padrão de implementação','Crie a divisão em <span class="teal">duas etapas</span>','A proporção 60/20/20 é uma ilustração, não uma regra universal. Proteja o teste antes das escolhas de desenvolvimento.','<pre>from sklearn.model_selection import train_test_split\n\n# 1) Proteja o conjunto de teste.\nX_resto, X_test, y_resto, y_test = train_test_split(\n    X, y, test_size=0.20, stratify=y, random_state=0\n)\n\n# 2) Divida os 80% restantes em treino e validação.\nX_train, X_val, y_train, y_val = train_test_split(\n    X_resto, y_resto, test_size=0.25,\n    stratify=y_resto, random_state=0\n)</pre>'],
      ['Partições reproduzíveis','Estratifique as classes. Fixe a <span class="teal">semente.</span>','Essas duas opções resolvem problemas diferentes: representatividade e repetibilidade.','<div class="grid2"><div class="card green"><h3><code>stratify=y</code></h3><p>Mantém a proporção das classes em cada corte. Isso é importante quando uma classe é rara.</p></div><div class="card cyan"><h3><code>random_state=0</code></h3><p>Fixa o sorteio para que o experimento possa ser repetido com as mesmas partições.</p></div></div>'],
      ['Fluxo correto de seleção','Desenvolva aqui. Decida aqui. <span class="teal">Reporte aqui.</span>','O conjunto de teste não é um painel de desenvolvimento. Consultá-lo repetidamente reduz a independência da estimativa.','<div class="flow"><div class="node">1. Treine candidatos<br><span class="small">Conjunto de treino</span></div><div class="arrow">→</div><div class="node">2. Compare e ajuste<br><span class="small">Conjunto de validação</span></div><div class="arrow">→</div><div class="node">3. Escolha um fluxo<br><span class="small">Candidato final</span></div><div class="arrow">→</div><div class="node">4. Confirme uma vez<br><span class="small">Teste protegido</span></div></div>'],
      ['Vazamento no pré-processamento','Um erro sutil pode deixar os resultados <span class="teal">otimistas demais.</span>','Ajustar scaler, imputador ou seletor de atributos na base completa permite que o treino “enxergue” propriedades do teste.','<div class="grid2"><div class="card bad"><h3>✕ Errado</h3><p>Ajustar transformações na base inteira e só depois separar treino e teste.</p><div class="flow"><div class="node">Base completa</div><div class="arrow">→</div><div class="node">Fit do scaler<br>treino + teste</div><div class="arrow">→</div><div class="node">Separa depois</div></div></div><div class="card good"><h3>✓ Certo</h3><p>Separe primeiro. Ajuste transformações somente no treino. Aplique no teste sem reajustar.</p><div class="flow"><div class="node">Separe primeiro</div><div class="arrow">→</div><div class="node">Fit do scaler<br>só no treino</div><div class="arrow">→</div><div class="node">Transform no teste</div></div></div></div>'],
      ['fit versus transform','<span class="teal">Fit</span> aprende. <span class="teal">Transform</span> aplica.','O conjunto de teste pode receber uma transformação já aprendida, mas não deve ajudar a aprendê-la.','<pre>from sklearn.preprocessing import StandardScaler\n\n# ERRADO: as estatísticas incluem a distribuição do teste.\nscaler = StandardScaler().fit(X)\n\n# CERTO: aprende média e desvio somente no treino.\nscaler = StandardScaler().fit(X_train)\nX_test_ready = scaler.transform(X_test)</pre>'],
      ['A solução com Pipeline','Um fluxo. <span class="teal">A ordem correta.</span>','Um Pipeline do scikit-learn conecta pré-processamento e estimador. Ao chamar fit nos dados de treino, todas as etapas aprendidas usam somente treino.','<div class="flow"><div class="node">Features de treino</div><div class="arrow">→</div><div class="node">Pré-processamento<br><span class="small">fit só no treino</span></div><div class="arrow">→</div><div class="node">Classificador / regressor<br><span class="small">fit só no treino</span></div><div class="arrow">→</div><div class="node">Fluxo salvo</div></div><div class="flow"><div class="node">Features de teste / produção</div><div class="arrow">→</div><div class="node">Mesmas transformações aprendidas</div><div class="arrow">→</div><div class="node">Predição</div></div>'],
      ['ColumnTransformer + Pipeline','Colunas diferentes, <span class="teal">um objeto seguro.</span>','A aula combina padronização numérica, codificação categórica e regressão logística em um pipeline.','<pre>from sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.linear_model import LogisticRegression\n\npreprocessor = ColumnTransformer([\n    ("num", StandardScaler(), colunas_numericas),\n    ("cat", OneHotEncoder(), colunas_categoricas),\n])\n\nmodel = Pipeline([\n    ("prep", preprocessor),\n    ("clf", LogisticRegression()),\n])\n\nmodel.fit(X_train, y_train)\npredictions = model.predict(X_test)</pre>'],
      ['Além da sala de aula','O deploy possui <span class="teal">dois riscos diferentes.</span>','O mesmo pipeline ajuda a manter consistência no deploy, mas o monitoramento continua necessário depois dele.','<div class="grid2"><div class="card warn"><h3>Skew treino–produção · agora</h3><p>Treino e produção processam features de formas diferentes. Defesa: usar o mesmo pipeline validado nos dois contextos.</p></div><div class="card cyan"><h3>Data drift · depois</h3><p>Os dados que chegam mudam com o tempo. Defesa: monitorar e retreinar ou revisar o modelo quando necessário.</p></div></div>'],
      ['Variações de hold-out','A divisão deve combinar com o <span class="teal">contexto da decisão.</span>','“Hold-out” pode descrever práticas diferentes. A finalidade determina o desenho.','<table><thead><tr><th>Cenário</th><th>Desenho apropriado</th><th>Por quê</th></tr></thead><tbody><tr><td>Tarefa padrão de ML</td><td>Hold-out aleatório; frequentemente estratificado</td><td>Cria papéis de treino, validação e teste protegido.</td></tr><tr><td>Predição temporal</td><td>Treinar no passado; testar em períodos posteriores</td><td>O futuro não pode influenciar uma previsão do passado.</td></tr><tr><td>Impacto de produto</td><td>Global holdout de usuários</td><td>Mede melhoria do produto, não o ajuste de um modelo.</td></tr><tr><td>Um corte instável</td><td>Validação cruzada</td><td>Agrega vários cortes; é o tema da próxima aula.</td></tr></tbody></table>'],
      ['Encerramento','Mantenha o teste <span class="teal">lacrado.</span>','Aprenda no treino, escolha na validação e reporte o desempenho final no teste protegido.','<div class="grid3"><div class="card"><h3>Honestidade</h3><p>Separe escolhas de desenvolvimento da avaliação final.</p></div><div class="card"><h3>Segurança</h3><p>Ajuste transformações somente onde é permitido aprender.</p></div><div class="card"><h3>Reprodutibilidade</h3><p>Use cortes explícitos, sementes fixas e pipelines completos.</p></div></div><div class="quote">Um modelo não é confiável apenas porque funciona. Seu processo de avaliação também precisa ser confiável.</div>']
    ];
    let lang='en', index=0, startX=null;
    const stage=document.getElementById('stage'), counter=document.getElementById('counter'), fill=document.getElementById('progressFill');
    function deck(){return lang==='en'?en:pt;}
    function render(){const s=deck()[index], total=deck().length; stage.innerHTML='<article class="slide active"><div class="tag">'+s[0]+'</div><h1>'+s[1]+'</h1><p class="lead">'+s[2]+'</p>'+s[3]+'</article>'; counter.textContent=String(index+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'); fill.style.width=((index+1)/total*100)+'%'; document.getElementById('prevBtn').disabled=index===0; document.getElementById('nextBtn').disabled=index===total-1; document.getElementById('prevLabel').textContent=lang==='pt'?'Anterior':'Previous'; document.getElementById('nextLabel').textContent=lang==='pt'?'Próximo':'Next'; document.getElementById('course').textContent=lang==='pt'?'Ciência de Dados & IA/ML · Avaliação de Modelos':'Data Science & AI/ML · Model Evaluation'; document.getElementById('enBtn').classList.toggle('active',lang==='en'); document.getElementById('ptBtn').classList.toggle('active',lang==='pt'); }
    function move(n){index=Math.max(0,Math.min(deck().length-1,index+n));render();}
    function full(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}
    document.getElementById('enBtn').onclick=()=>{lang='en';index=0;render();}; document.getElementById('ptBtn').onclick=()=>{lang='pt';index=0;render();}; document.getElementById('homeBtn').onclick=()=>{index=0;render();}; document.getElementById('fullBtn').onclick=full; document.getElementById('prevBtn').onclick=()=>move(-1); document.getElementById('nextBtn').onclick=()=>move(1);
    window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();move(1);} if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();move(-1);} if(e.key==='Home'){e.preventDefault();index=0;render();} if(e.key==='End'){e.preventDefault();index=deck().length-1;render();} if(e.key.toLowerCase()==='f')full();});
    document.getElementById('app').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true}); document.getElementById('app').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>48)move(dx<0?1:-1);startX=null;},{passive:true}); render();
  </script>
