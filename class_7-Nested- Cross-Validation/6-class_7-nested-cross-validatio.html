(function(){var idx=0,lang='en',theme='dark',round=0,guess=null,timer=null,startX=0;var T={en:{brand:'Nested Cross-Validation',course:'Class 13 · Model Evaluation & Selection',hint:'← → navigate · swipe · F fullscreen · Home restart',slides:[['PUC-SP · Data Science & Machine Learning','Nested CV: <span class="accent">audit the choice,</span><br>not only the model.','A visual, interactive guide to honest hyperparameter evaluation: inner CV chooses; outer CV measures.','“Who chooses must not measure on the same data.”',['GridSearchCV','Inner loop','Outer loop','SVC pipeline','Winner’s curse']],['01 · The selection problem','The best score can be a <span class="accent">lucky winner</span>.','When several candidates are tested, the maximum score tends to rise even when their true performance is the same.'],['02 · Hyperparameter grid','Search chooses a <span class="teal">candidate</span>.','The implemented grid tests 3 values of C × 3 values of gamma: 9 SVC configurations evaluated by internal cross-validation.'],['03 · Nested design','The <span class="teal">inner loop</span> chooses.<br>The <span class="accent">outer loop</span> measures.','The inner search never touches the outer validation fold. That separation makes the external score an honest audit of the workflow.'],['04 · Honest estimate','Report the external <span class="accent">mean ± standard deviation</span>.','The five outer scores summarize the expected behavior of the selection-and-training process, not a single lucky split.'],['05 · Implementation','One line turns a search into <span class="teal">Nested CV</span>.','Pass the GridSearchCV object into cross_val_score. The outer loop treats the complete search as an estimator.'],['06 · Manual reconstruction','Each outer round starts a <span class="accent">new search</span>.','Manual iteration confirms that each outer fold receives an independent GridSearchCV trained only on its outer training partition.'],['07 · Cost','Honest evaluation has a <span class="accent">computational cost</span>.','The number of fits multiplies across combinations, inner folds, and outer folds.'],['08 · Variable winners','Outer folds can choose <span class="teal">different hyperparameters</span>.','That is expected: Nested CV evaluates the selection process under slightly different training data, not one permanently perfect C.'],['09 · Final decision','Nested CV gives the <span class="accent">number</span>.<br>Final search gives the <span class="teal">model</span>.','After the audit, run one GridSearchCV on all data to obtain best_params_ and best_estimator_ for delivery.'],['10 · When to use','Use the method that protects the <span class="accent">measurement</span>.','Nested CV is most valuable with limited data, repeated tuning, or a test set that has already influenced decisions.'],['11 · Responsible evaluation','Evaluation integrity is part of <span class="teal">responsible AI</span>.','Separate selection from measurement, document seeds and grids, and avoid overstating estimates.'],['Conclusion','A higher score is not always a <span class="accent">truer score</span>.','Nested CV reveals optimism, reports uncertainty, and keeps the final claim credible.']]},pt:{brand:'Validação Cruzada Aninhada',course:'Aula 13 · Avaliação e Seleção de Modelos',hint:'← → navegar · deslize · F tela cheia · Home reiniciar',slides:[['PUC-SP · Ciência de Dados & Machine Learning','Nested CV: <span class="accent">audite a escolha,</span><br>não apenas o modelo.','Um guia visual e interativo para avaliação honesta de hiperparâmetros: o laço interno escolhe; o externo mede.','“Quem escolhe não mede nos mesmos dados.”',['GridSearchCV','Laço interno','Laço externo','Pipeline SVC','Maldição do vencedor']],['01 · O problema da seleção','A melhor nota pode ser uma <span class="accent">vencedora com sorte</span>.','Quando vários candidatos são testados, o máximo tende a subir mesmo quando o desempenho real dos candidatos é igual.'],['02 · Grade de hiperparâmetros','A busca escolhe um <span class="teal">candidato</span>.','A grade implementada testa 3 valores de C × 3 valores de gamma: 9 configurações SVC avaliadas por validação interna.'],['03 · Desenho aninhado','O <span class="teal">laço interno</span> escolhe.<br>O <span class="accent">laço externo</span> mede.','A busca interna nunca toca a dobra de validação externa. Essa separação torna a nota externa uma auditoria honesta do workflow.'],['04 · Estimativa honesta','Reporte a <span class="accent">média ± desvio-padrão</span> externa.','As cinco notas externas resumem o comportamento esperado do processo de seleção e treino, não de uma divisão com sorte.'],['05 · Implementação','Uma linha transforma a busca em <span class="teal">Nested CV</span>.','Passe o objeto GridSearchCV para cross_val_score. O laço externo trata a busca completa como um estimador.'],['06 · Reconstrução manual','Cada rodada externa inicia uma <span class="accent">nova busca</span>.','A iteração manual confirma que cada dobra externa recebe um GridSearchCV independente, treinado apenas na sua partição externa de treino.'],['07 · Custo','Avaliação honesta tem <span class="accent">custo computacional</span>.','O número de ajustes se multiplica entre combinações, dobras internas e dobras externas.'],['08 · Vencedores variáveis','Dobras externas podem escolher <span class="teal">hiperparâmetros diferentes</span>.','Isso é esperado: Nested CV avalia o processo de seleção com dados de treino levemente diferentes, não um C perfeito e permanente.'],['09 · Decisão final','Nested CV fornece o <span class="accent">número</span>.<br>A busca final fornece o <span class="teal">modelo</span>.','Após a auditoria, rode um GridSearchCV em todos os dados para obter best_params_ e best_estimator_ para entrega.'],['10 · Quando usar','Use o método que protege a <span class="accent">medição</span>.','Nested CV é mais valioso com dados limitados, tuning repetido ou um teste que já influenciou decisões.'],['11 · Avaliação responsável','Integridade de avaliação faz parte da <span class="teal">IA responsável</span>.','Separe seleção de medição, documente seeds e grades e evite superestimar as estimativas.'],['Conclusão','Uma nota maior nem sempre é uma <span class="accent">nota mais verdadeira</span>.','Nested CV revela otimismo, reporta incerteza e mantém a conclusão final crível.']]}};function icon(n){var d={shield:'<path d="M12 22s8-3.8 8-10V5l-8-3-8 3v7c0 6.2 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-6h6v6"/>',full:'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>',theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',exit:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>',spark:'<path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>'};return '<svg viewBox="0 0 24 24">'+d[n]+'</svg>'}function head(s){return '<p class="eyebrow">'+s[0]+'</p><h2 class="title">'+s[1]+'</h2><p class="lead">'+s[2]+'</p>'}function loop(t){var names=t==='en'?'Fold':'Dobra',inner=t==='en'?'INNER LOOP · CHOOSES HYPERPARAMETERS':'LAÇO INTERNO · ESCOLHE HIPERPARÂMETROS',outer=t==='en'?'OUTER LOOP · MEASURES UNSEEN DATA':'LAÇO EXTERNO · MEDE DADOS INÉDITOS',score=t==='en'?'Score untouched outer fold':'Pontue a dobra externa inédita',question=t==='en'?'Which fold will become the next external test fold?':'Qual dobra será o próximo teste externo?',wait=t==='en'?'Predict, then reveal the gold fold movement.':'Faça sua previsão e revele o movimento da dobra dourada.',reveal=t==='en'?'Reveal rotation':'Revelar rotação';var scores=['0.9000','0.8167','0.8500','0.9167','0.7500'];return '<div class="outer"><div class="outer-title">'+outer+'</div><div class="fold-row">'+[0,1,2,3,4].map(i=>'<div class="ofold '+(i===round?'test':'')+'">'+names+' '+(i+1)+'</div>').join('')+'</div><div class="inner"><div class="inner-title">'+inner+'</div><div class="inner-flow"><div class="inner-cell">C=.1<br>γ=.01</div><div class="inner-cell winner">C=1<br>γ=.1</div><div class="inner-cell">C=10<br>γ=1</div></div></div><div class="arrowdown"></div><div class="external-score">'+score+' → '+scores[round]+'</div><div class="interactive"><div class="interactive-head">'+icon('spark')+'<span>'+(t==='en'?'INTERACTIVE MOMENT':'MOMENTO INTERATIVO')+'</span></div><p>'+question+'</p><div class="guess-row">'+[0,1,2,3,4].map(i=>'<button class="guess '+(guess===i?'selected':'')+'" data-g="'+i+'">'+names+' '+(i+1)+'</button>').join('')+'</div><div id="feedback" class="feedback">'+(guess===null?wait:'')+'</div><button id="reveal" class="guess">'+reveal+'</button></div></div>'}function render(){clearInterval(timer);document.documentElement.dataset.theme=theme;document.documentElement.lang=lang;var t=T[lang],s=t.slides[idx],en=lang==='en',body='';if(idx===0)body='<div class="hero"><div><p class="eyebrow">'+s[0]+'</p><h1 class="title">'+s[1]+'</h1><p class="lead">'+s[2]+'</p></div><div class="hero-bottom"><div><p class="quote">'+s[3]+'</p><div class="pills">'+s[4].map(x=>'<span class="pill">'+x+'</span>').join('')+'</div></div><div class="orb"></div></div></div>';else if(idx===1)body='<div class="two"><div>'+head(s)+'<div class="sim-bars"><div class="bar" style="--h:80px"><b>.852</b><label>9 '+(en?'attempts':'tentativas')+'</label></div><div class="bar" style="--h:105px"><b>.880</b><label>100 '+(en?'attempts':'tentativas')+'</label></div><div class="bar" style="--h:135px"><b>.923</b><label>1K '+(en?'attempts':'tentativas')+'</label></div></div></div><div class="metric-grid"><div class="metric"><span>'+ (en?'True reference':'Referência real')+'</span><b>0.800</b><small>'+ (en?'Same expected score':'Mesma nota esperada')+'</small></div><div class="metric"><span>'+ (en?'Sea "result"><span>Nested CV</span><b>0.8467 ± 0.0600</b><small>'+ (en?'Reportable estimate':'Estimativa reportável')+'</small></div><div class="result"><span>'+ (en?'Measured optimism':'Otimismo medido')+'</span><b>0.0167</b><small>0.8633 − 0.8467</small></div></div></div>';else if(idx===5)body='<div>'+head(s)+'<pre class="code"><code><span class="cg">from</span> sklearn.model_selection <span class="cg">import</span> GridSearchCV, cross_val_score\n\nbusca = GridSearchCV(novo_pipe(), GRADE, cv=interno)\nnotas = cross_val_score(busca, X, y, cv=externo)\n\nprint(notas.mean(), notas.std())\n<span class="cy"># 0.8467, 0.0600</span></code></pre></div>';else if(idx===6)body='<div>'+head(s)+'<div class="flow">'+(en?[['Outer split','Train / test indices'],['New search','Fresh GridSearchCV'],['Inner CV','Choose C and gamma'],['Fit','Outer training data'],['Score','Outer unseen fold']]:[['Split externo','Índices treino / teste'],['Nova busca','GridSearchCV novo'],['CV interna','Escolhe C e gamma'],['Treino','Dados externos de treino'],['Nota','Dobra externa inédita']]).map(x=>'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div><p class="lead">'+(en?'The manual implementation reproduced the same Nested CV mean: 0.8467.':'A implementação manual reproduziu a mesma média Nested CV: 0.8467.')+'</p></div>';else if(idx===7)body='<div>'+head(s)+'<div class="cost"><div class="cost-box"><span>'+ (en?'Search only':'Apenas busca')+'</span><b>45 fits</b><p>9 '+(en?'combinations':'combinações')+' × 5 '+(en?'inner folds':'dobras internas')+'<br>≈ 0.33 s</p></div><div class="cost-box"><span>Nested CV</span><b>225 fits</b><p>9 '+(en?'combinations':'combinações')+' × 5 '+(en?'inner':'internas')+' × 5 '+(en?'outer folds':'dobras externas')+'<br>≈ 1.48 s · 4.48× '+(en?'runtime':'tempo')+'</p></div></div></div>';else if(idx===8)body='<div>'+head(s)+'<div class="table"><div class="tr head"><b>'+ (en?'Combination':'Combinação')+'</b><b>'+ (en?'Frequency':'Frequência')+'</b><b>'+ (en?'Meaning':'Significado')+'</b></div><div class="tr"><b>C=1, γ=.1</b><div class="tag">3 / 5</div><span>'+ (en?'Most frequent, not permanent truth.':'Mais frequente, não verdade permanente.')+'</span></div><div class="tr"><b>C=10, γ=.01</b><div class="tag">1 / 5</div><span>'+ (en?'Chosen in another training partition.':'Escolhido em outra partição de treino.')+'</span></div><div class="tr"><b>C=.1, γ=.1</b><div class="tag">1 / 5</div><span>'+ (en?'Selection changes with data.':'A escolha muda com os dados.')+'</span></div></div></div>';else if(idx===9)body='<div>'+head(s)+'<div class="flow">'+(en?[['Nested CV','Announce 0.8467 ± 0.0600'],['Audit','Selection workflow measured'],['All data','Run final search'],['GridSearchCV','Select parameters'],['Deliver','SVC: C=1, γ=.1']]:[['Nested CV','Anuncie 0.8467 ± 0.0600'],['Auditoria','Workflow medido'],['Todos os dados','Rode busca final'],['GridSearchCV','Selecione parâmetros'],['Entregue','SVC: C=1, γ=.1']]).map(x=>'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div></div>';else if(idx===10)body='<div>'+head(s)+'<div class="table"><div class="tr head"><b>'+ (en?'Situation':'Situação')+'</b><b>'+ (en?'Use':'Use')+'</b><b>'+ (en?'Reason':'Motivo')+'</b></div><div class="tr"><b>'+ (en?'Large data + untouched test':'Base grande + teste intocado')+'</b><div class="tag">GridSearchCV</div><span>'+ (en?'Search in training, measure once on test.':'Busque no treino, meça uma vez no teste.')+'</span></div><div class="tr"><b>'+ (en?'Small dataset':'Base pequena')+'</b><div class="tag">Nested CV</div><span>'+ (en?'Several external scores without losing a fixed test split.':'Várias notas externas sem perder um teste fixo.')+'</span></div><div class="tr"><b>'+ (en?'Test influenced choices':'Teste influenciou escolhas')+'</b><div class="tag">Nested CV</div><span>'+ (en?'The old test is no longer impartial.':'O teste anterior não é mais imparcial.')+'</span></div></div></div>';else if(idx===11)body='<div>'+head(s)+'<div class="checks"><div class="check">'+(en?'Document data, grids, metrics, and seeds.':'Documente dados, grades, métricas e seeds.')+'</div><div class="check">'+(en?'Keep preprocessing inside Pipeline.':'Mantenha pré-processamento no Pipeline.')+'</div><div class="check">'+(en?'Do not report selection maxima as final truth.':'Não reporte máximos de seleção como verdade final.')+'</div><div class="check">'+(en?'Match metrics to real error costs.':'Associe métricas aos custos reais de erro.')+'</div></div></div>';else body='<div class="closing"><div class="ring"><i></i></div><p class="eyebrow">'+s[0]+'</p><h2 class="title">'+s[1]+'</h2><p class="lead">'+s[2]+'</p></div>';document.getElementById('app').innerHTML='<header class="top"><div class="brand"><div class="mark">'+icon('shield')+'</div><div><b>'+t.brand+'</b><small>'+t.course+'</small></div></div><div class="tools"><div class="lang"><button id="en" class="'+(lang==='en'?'active':'')+'">EN</button><button id="pt" class="'+(lang==='pt'?'active':'')+'">PT</button></div><button class="icon" id="theme">'+icon('theme')+'</button><button class="icon" id="full">'+icon('full')+'</button><button class="icon" id="home">'+icon('home')+'</button><button class="icon" id="exit">'+icon('exit')+'</button></div></header><section class="stage"><article class="slide">'+body+'</article></section><footer class="bottom"><div class="progress-wrap"><div class="progress"><i style="width:'+((idx+1)/13*100)+'%"></i></div><span class="count">'+String(idx+1).padStart(2,'0')+' / 13</span></div><div class="hint">'+t.hint+'</div><nav class="dots">'+Array.from({length:13},(_,i)=>'<button class="dot '+(i===idx?'active':'')+'" data-i="'+i+'"></button>').join('')+'</nav></footer>';function go(n){idx=Math.max(0,Math.min(12,n));render()}document.getElementById('en').onclick=function(){lang='en';render()};document.getElementById('pt').onclick=function(){lang='pt';render()};document.getElementById('theme').onclick=function(){theme=theme==='dark'?'light':'dark';render()};document.getElementById('full').onclick=function(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};document.getElementById('home').onclick=function(){go(0)};document.getElementById('exit').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();go(0)};document.querySelectorAll('[data-i]').forEach(x=>x.onclick=function(){go(+x.dataset.i)});if(idx===3){var box=document.getElementById('loop');function update(){box.innerHTML=loop(lang);document.querySelectorAll('[data-g]').forEach(x=>x.onclick=function(){guess=+x.dataset.g;update()});document.getElementById('reveal').onclick=function(){var next=(round+1)%5,fb=document.getElementById('feedback');if(guess!==null){var ok=guess===next;fb.textContent=ok?(lang==='en'?'Correct — that is the next outer test fold.':'Correto — essa é a próxima dobra de teste externa.'):(lang==='en'?'Not this time — the gold fold shows the next partition.':'Ainda não — a dobra dourada mostra a próxima partição.');fb.className='feedback '+(ok?'ok':'no')}round=next;guess=null;setTimeout(update,700)}}update();timer=setInterval(function(){round=(round+1)%5;guess=null;update()},3400)}}function move(n){idx=Math.max(0,Math.min(12,idx+n));render()}window.addEventListener('keydown',function(e){if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key==='Home'){idx=0;render()}else if(e.key==='End'){idx=12;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}});document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{var d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:t
