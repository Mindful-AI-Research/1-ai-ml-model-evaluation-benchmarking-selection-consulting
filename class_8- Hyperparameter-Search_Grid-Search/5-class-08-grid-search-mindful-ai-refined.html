(function(){var idx=0,lang='en',theme='dark',startX=0;var T={en:{brand:'Hyperparameter Search',course:'Class 08 · GridSearchCV',back:'Back',next:'Next',restart:'Restart',hint:'← → navigate · swipe · F fullscreen · Home restart',slides:[['PUC-SP · Data Science & Machine Learning','Grid Search: <span class="accent">systematic selection,</span><br>protected evaluation.','A visual and interactive guide to tuning Logistic Regression safely with GridSearchCV, stratified validation, and one protected test evaluation.','“Training learns. Validation chooses. Test confirms — once.”',['GridSearchCV','Logistic Regression','Average Precision','StratifiedKFold','Pipeline']],['01 · The rule','The test set is <span class="accent">not a tuning dashboard</span>.','Hyperparameters are selected in cross-validation on training data. The test set remains untouched until the final confirmation.'],['02 · Exhaustive search','Every new axis <span class="accent">multiplies</span> the search cost.','GridSearchCV evaluates all parameter combinations. A small grid becomes expensive as options and folds multiply.'],['03 · Search outputs','Four attributes, <span class="accent">four roles</span>.','Read GridSearchCV outputs correctly: identify the winner, inspect uncertainty, and reserve final claims for test data.'],['04 · Pipeline search','Tune the <span class="accent">whole pipeline</span>, not preprocessed data.','The scaler is fitted inside each fold; clf__C tells GridSearchCV which pipeline step owns the hyperparameter.'],['05 · Notebook code','The implemented <span class="accent">GridSearchCV workflow</span>.','This is the real search configuration from the completed lab notebook.'],['06 · Demonstrated result','A plateau changes how we <span class="accent">interpret winners</span>.','The completed notebook found all 10 configurations within one standard deviation of the champion.'],['07 · Test confirmation','The protected test set gives the <span class="accent">reportable result</span>.','After choosing the pipeline, evaluate its probabilities once on the held-out test data.'],['08 · Scoring','The metric decides <span class="accent">what wins</span>.','With 12.2% hits, accuracy can reward a model that ignores hits. Average Precision is the primary search metric.'],['09 · Signal 1','Validation rises. <span class="accent">Nested CV does not.</span>','When a larger grid raises best_score_ but not Nested CV, the selection process may be finding validation luck rather than true improvement.'],['10 · Signal 2','Shuffle labels: any discovery is <span class="accent">luck</span>.','A placebo experiment measures how much a large search can force validation when no real pattern exists.'],['11 · Signal 3','Change the seed: does the <span class="accent">winner move</span>?','If winners change across folds/seeds, the search may be selecting among tied configurations through noise.'],['12 · Interactive check','Can you choose the <span class="accent">correct reporting number</span>?','Use the class rule to decide whether best_score_ or the final test score should be reported.'],['Conclusion','Grid search chooses.<br><span class="accent">The protected test confirms.</span>','Inspect the full CV table, respect the plateau, match the metric to the problem, and preserve the test set for one final claim.']]},pt:{brand:'Busca de Hiperparâmetros',course:'Aula 08 · GridSearchCV',back:'Voltar',next:'Avançar',restart:'Reiniciar',hint:'← → navegar · deslize · F tela cheia · Home reiniciar',slides:[['PUC-SP · Ciência de Dados & Machine Learning','Grid Search: <span class="accent">seleção sistemática,</span><br>avaliação protegida.','Um guia visual e interativo para ajustar Regressão Logística com segurança usando GridSearchCV, validação estratificada e uma avaliação final protegida.','“Treino aprende. Validação escolhe. Teste confirma — uma vez.”',['GridSearchCV','Regressão Logística','Average Precision','StratifiedKFold','Pipeline']],['01 · A regra','O conjunto de teste <span class="accent">não é painel de tuning</span>.','Hiperparâmetros são escolhidos em validação cruzada nos dados de treino. O teste fica intocado até a confirmação final.'],['02 · Busca exaustiva','Cada eixo novo <span class="accent">multiplica</span> o custo da busca.','GridSearchCV avalia todas as combinações. Uma grade pequena fica cara quando opções e dobras se multiplicam.'],['03 · Saídas da busca','Quatro atributos, <span class="accent">quatro papéis</span>.','Leia as saídas do GridSearchCV corretamente: identifique a vencedora, inspecione incerteza e reserve conclusões finais para o teste.'],['04 · Busca no Pipeline','Ajuste o <span class="accent">Pipeline inteiro</span>, não dados pré-processados.','O scaler é ajustado dentro de cada dobra; clf__C informa a qual passo do Pipeline pertence o hiperparâmetro.'],['05 · Código do notebook','O workflow implementado de <span class="accent">GridSearchCV</span>.','Esta é a configuração real da busca no notebook completo do laboratório.'],['06 · Resultado demonstrado','Um platô muda como <span class="accent">interpretamos vencedores</span>.','O notebook de respostas encontrou as 10 configurações dentro de um desvio-padrão da campeã.'],['07 · Confirmação no teste','O teste protegido fornece o <span class="accent">resultado reportável</span>.','Após escolher o Pipeline, avalie suas probabilidades uma vez nos dados de teste reservados.'],['08 · Scoring','A métrica decide <span class="accent">quem vence</span>.','Com 12,2% de hits, accuracy pode premiar um modelo que ignora hits. Average Precision é a métrica principal da busca.'],['09 · Sinal 1','A validação sobe. <span class="accent">Nested CV não.</span>','Quando uma grade maior aumenta best_score_ mas não Nested CV, a busca pode estar encontrando sorte na validação, não melhoria real.'],['10 · Sinal 2','Embaralhe rótulos: qualquer descoberta é <span class="accent">sorte</span>.','O experimento placebo mede quanto uma busca grande consegue forçar a validação sem padrão real.'],['11 · Sinal 3','Troque a seed: o <span class="accent">vencedor muda</span>?','Se vencedores mudam entre dobras/seeds, a busca pode escolher entre configurações empatadas pelo ruído.'],['12 · Checagem interativa','Você consegue escolher o <span class="accent">número correto para reportar</span>?','Use a regra da aula para decidir se best_score_ ou a nota final de teste deve ser reportada.'],['Conclusão','Grid search escolhe.<br><span class="accent">O teste protegido confirma.</span>','Inspecione a tabela completa, respeite o platô, associe a métrica ao problema e preserve o teste para uma única conclusão final.']]}};const code=`grade = {\n    "clf__C": [0.01, 0.1, 1, 10, 100],\n    "clf__class_weight": [None, "balanced"],\n}\n\nbusca = GridSearchCV(\n    pipe,\n    grade,\n    scoring="average_precision",\n    cv=cv,\n)\n\nbusca.fit(X_tr, y_tr)\n\nprint("best_params_:", busca.best_params_)\nprint(f"best_score_: {busca.best_score_:.4f}")`;

div>').join('')+'</div><div class="calc">'+(en?'fits = 5 C values × 2 class weights × 5 CV folds = 50 model fits':'ajustes = 5 valores de C × 2 class weights × 5 dobras = 50 treinos')+'</div><div class="note"><b>'+ (en?'Engineering note: ':'Nota de engenharia: ')+'</b>'+ (en?'new grid axes multiply cost; they do not add cost.':'novos eixos da grade multiplicam o custo; não somam custo.')+'</div></div>';else if(idx===3)body='<div>'+title(s)+'<div class="attrs"><div class="tr head"><b>'+ (en?'Attribute':'Atributo')+'</b><b>'+ (en?'What it is':'O que é')+'</b><b>'+ (en?'Use':'Serve para')+'</b></div><div class="tr"><b>best_params_</b><span>'+ (en?'Dictionary containing the selected configuration.':'Dicionário com a configuração selecionada.')+'</span><div class="tag">'+ (en?'Know what won':'Saber o que venceu')+'</div></div><div class="tr"><b>best_score_</b><span>'+ (en?'Mean CV score of the selected configuration.':'Média CV da configuração selecionada.')+'</span><div class="tag">'+ (en?'Choose, not report':'Escolher, não reportar')+'</div></div><div class="tr"><b>best_estimator_</b><span>'+ (en?'Refit pipeline with selected parameters.':'Pipeline reajustado com parâmetros selecionados.')+'</span><div class="tag">'+ (en?'Take to test':'Levar ao teste')+'</div></div><div class="tr"><b>cv_results_</b><span>'+ (en?'Full table of means, deviations, parameters and ranks.':'Tabela completa de médias, desvios, parâmetros e ranks.')+'</span><div class="tag">'+ (en?'Inspect plateau':'Inspecionar platô')+'</div></div></div><div class="note"><b>'+ (en?'Report: ':'Reporte: ')+'</b>'+ (en?'the protected test result, measured once with best_estimator_.':'o resultado do teste protegido, medido uma vez com best_estimator_.')+'</div></div>';else if(idx===4)body='<div class="split"><div>'+title(s)+'<div class="why"><div class="card"><h3>'+ (en?'Why Pipeline?':'Por que Pipeline?')+'</h3><p>'+ (en?'It refits preprocessing inside each fold, preventing validation leakage.':'Ele reajusta o pré-processamento em cada dobra, prevenindo vazamento da validação.')+'</p></div><div class="card"><h3>'+ (en?'Why clf__C?':'Por que clf__C?')+'</h3><p>'+ (en?'The prefix directs GridSearchCV to parameter C in the classifier step named clf.':'O prefixo direciona GridSearchCV ao parâmetro C do passo classificador chamado clf.')+'</p></div></div></div><div class="flow">'+(en?[['Raw training fold','No leakage'],['StandardScaler','Fit on fold train'],['LogisticRegression','clf step'],['Average Precision','Scoring'],['StratifiedKFold','Keeps hit ratio']]:[['Dobra de treino','Sem vazamento'],['StandardScaler','Fit no treino'],['LogisticRegression','Passo clf'],['Average Precision','Scoring'],['StratifiedKFold','Mantém proporção']]).map(x=>'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div></div>';else if(idx===5)body='<div class="code-layout"><div>'+title(s)+'<div class="why"><div class="card"><h3>'+ (en?'What it does':'Para que serve')+'</h3><p>'+ (en?'Exhaustively evaluates the ten Logistic Regression configurations on five stratified validation folds.':'Avalia exaustivamente as dez configurações de Regressão Logística em cinco dobras estratificadas.')+'</p></div><div class="card"><h3>'+ (en?'Why it matters':'Por que importa')+'</h3><p>'+ (en?'The scoring argument defines the exact objective that the search maximizes.':'O argumento scoring define o objetivo exato que a busca maximiza.')+'</p></div></div></div><div class="code-wrap"><button id="copy" class="copy">'+(en?'Copy code':'Copiar código')+'</button><pre class="code"><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre><div class="output">best_params_: {'+'\'clf__C\': 1, \'clf__class_weight\': None}'+ '\nbest_score_: 0.7207</div></div></div>';else if(idx===6)body='<div>'+title(s)+'<div class="results"><div class="result"><span>'+ (en?'Winning parameters':'Parâmetros vencedores')+'</span><b>C=1<br>class_weight=None</b><small>best_params_</small></div><div class="result"><span>'+ (en?'Validation AP':'AP de validação')+'</span><b>0.7207</b><small>best_score_</small></div><div class="result"><span>'+ (en?'Plateau':'Platô')+'</span><b>10 / 10</b><small>'+ (en?'within 1 std of champion':'dentro de 1 desvio da campeã')+'</small></div></div><div class="note"><b>'+ (en?'Interpretation: ':'Interpretação: ')+'</b>'+ (en?'the completed notebook found no strong separation between grid candidates. Prefer a simple, defensible configuration.':'o notebook completo não encontrou forte separação entre as candidatas. Prefira uma configuração simples e defensável.')+'</div></div>';else if(idx===7)body='<div>'+title(s)+'<div class="results"><div class="result"><span>'+ (en?'Test Average Precision':'Average Precision no teste')+'</span><b>0.7116</b><small>'+ (en?'Final ranking quality':'Qualidade final de ranking')+'</small></div><div class="result"><span>'+ (en?'Test ROC AUC':'ROC AUC no teste')+'</span><b>0.9296</b><small>'+ (en?'Threshold-independent separation':'Separação independente de limiar')+'</small></div><div class="result"><span>best_score_</span><b>0.7207</b><small>'+ (en?'Validation-only selection score':'Nota de seleção na validação')+'</small></div></div><div class="note"><b>'+ (en?'Reading: ':'Leitura: ')+'</b>'+ (en?'test AP is close to validation AP, a healthy outcome in the demonstrated run.':'a AP de teste está próxima da AP de validação, um cenário saudável no experimento demonstrado.')+'</div></div>';else if(idx===8)body='<div class="split"><div>'+title(s)+'<div class="note"><b>'+ (en?'Class imbalance: ':'Classe desbalanceada: ')+'</b>'+ (en?'hits are approximately 12.2% of tracks.':'hits correspondem a aproximadamente 12,2% das faixas.')+'</div></div><div class="metric-grid"><div class="metric"><span>'+ (en?'Dummy accuracy':'Accuracy do chute')+'</span><b>0.878</b><small>'+ (en?'High and misleading':'Alta e enganosa')+'</small></div><div class="metric"><span>'+ (en?'Dummy AP':'AP do chute')+'</span><b>0.122</b><small>'+ (en?'Equals hit prevalence':'Igual à prevalência de hits')+'</small></div><div class="metric"><span>'+ (en?'Search scoring':'Scoring da busca')+'</span><b>AP</b><small>average_precision</small></div><div class="metric"><span>'+ (en?'Lesson':'Lição')+'</span><b>'+ (en?'Metric = objective':'Métrica = objetivo')+'</b><small>'+ (en?'It decides who wins':'Ela decide quem vence')+'</small></div></div></div>';else if(idx===9)body='<div>'+title(s)+'<div class="signal"><div class="chart"><div class="bar" style="--h:67%"><b>.378</b><label>16</label></div><div class="bar" style="--h:87%"><b>.425</b><label>64</label></div><div class="bar" style="--h:94%"><b>.433</b><label>196</label></div></div><div class="warning"><h3>'+ (en?'Validation optimism indicator':'Indicador de otimismo na validação')+'</h3><p>'+ (en?'In the review example, best_score_ rose from 0.378 to 0.433 while Nested CV did not improve, moving from 0.367 to 0.359. The widening gap is the warning.':'No exemplo de revisão, best_score_ subiu de 0,378 para 0,433 enquanto Nested CV não melhorou, indo de 0,367 para 0,359. A distância crescente é o alerta.')+'</p></div></div></div>';else if(idx===10)body='<div>'+title(s)+'<div class="signal"><div class="chart"><div class="bar" style="--h:58%"><b>.147</b><label>1</label></div><div class="bar" style="--h:63%"><b>.162</b><label>16</label></div><div class="bar" style="--h:65%"><b>.167</b><label>196</label></div><div class="bar" style="--h:78%"><b>.196</b><label>1960</label></div></div><div class="warning"><h3>'+ (en?'Placebo test':'Teste placebo')+'</h3><p>'+ (en?'With shuffled labels there is no pattern to learn. In the review example, AP reached 0.196 with 1,960 combinations despite a chance baseline near 0.122.':'Com rótulos embaralhados não há padrão a aprender. No exemplo de revisão, AP chegou a 0,196 com 1.960 combinações apesar de uma base ao acaso próxima de 0,122.')+'</p></div></div></div>';else if(idx===11)body='<div>'+title(s)+'<div class="attrs"><div class="tr head"><b>'+ (en?'Search':'Busca')+'</b><b>'+ (en?'Different winners / 10 seeds':'Vencedores diferentes / 10 seeds')+'</b><b>'+ (en?'Interpretation':'Leitura')+'</b></div><div class="tr"><b>'+ (en?'Small logistic grid':'Grade logística pequena')+'</b><div class="tag">3</div><span>'+ (en?'Six configurations lie on a plateau.':'As seis configurações estão em platô.')+'</span></div><div class="tr"><b>'+ (en?'Large decision-tree grid':'Grade grande de árvore')+'</b><div class="tag">9</div><span>'+ (en?'The champion is nearly determined by fold partition noise.':'A campeã é quase determinada pelo ruído das dobras.')+'</span></div></div><div class="note"><b>'+ (en?'What to do: ':'O que fazer: ')+'</b>'+ (en?'inspect cv_results_, prefer the simplest plateau option, and use repeated stratified CV when appropriate.':'inspecione cv_results_, prefira a opção mais simples do platô e use CV estratificada repetida quando apropriado.')+'</div></div>';else if(idx===12)body='<div>'+title(s)+'<div class="quiz"><div class="quiz-head">'+ (en?'INTERACTIVE CHECK':'CHECAGEM INTERATIVA')+'</div><p>'+ (en?'Grid search ended with best_score_ = 0.79. The protected test, touched once with best_estimator_, returned 0.76. Which number should be reported?':'A busca terminou com best_score_ = 0,79. O teste protegido, tocado uma vez com best_estimator_, retornou 0,76. Qual número deve ser reportado?')+'</p><div class="answers"><button class="ans" data-a="a">A · 0.76</button><button class="ans" data-a="b">B · 0.79</button><button class="ans" data-a="c">C · 0.775</button><button class="ans" data-a="d">D · '+ (en?'both':'os dois')+'</button></div><div id="feedback" class="feedback">'+ (en?'Choose an answer.':'Escolha uma resposta.')+'</div></div></div>';else body='<div class="closing"><div class="ring"><i></i></div><p class="eyebrow">'+s[0]+'</p><h2 class="title">'+s[1]+'</h2><p class="lead">'+s[2]+'</p><div class="pills" style="justify-content:center;margin-top:24px">'+(en?['Pipeline prevents leakage','CV chooses','Test confirms once','Inspect the plateau']:['Pipeline evita vazamento','CV escolhe','Teste confirma uma vez','Inspecione o platô']).map(x=>'<span class="pill">'+x+'</span>').join('')+'</div></div>';document.getElementById('app').innerHTML='<header class="top"><div class="brand"><div class="mark">'+icon('shield')+'</div><div><b>'+t.brand+'</b><small>'+t.course+'</small></div></div><div class="tools"><div class="lang"><button id="en" class="'+(lang==='en'?'active':'')+'">EN</button><button id="pt" class="'+(lang==='pt'?'active':'')+'">PT</button></div><button class="icon" id="theme">'+icon('theme')+'</button><button class="icon" id="full">'+icon('full')+'</button><button class="icon" id="home">'+icon('home')+'</button></div></header><section class="stage"><article class="slide">'+body+'</article></section><footer class="footer"><div class="footer-top"><div class="progress-wrap"><div class="progress"><i style="width:'+((idx+1)/14*100)+'%"></i></div><span class="count">'+String(idx+1).padStart(2,'0')+' / 14</span></div><div class="nav-controls"><button class="nav" id="back">'+icon('left')+'<span>'+t.back+'</span></button><button class="nav" id="restart">'+icon('restart')+'<span>'+t.restart+'</span></button><button class="nav primary" id="next"><span>'+t.next+'</span>'+icon('right')+'</button></div><div class="hint">'+t.hint+'</div><nav class="dots">'+Array.from({length:14},(_,i)=>'<button class="dot '+(i===idx?'active':'')+'" data-i="'+i+'"></button>').join('')+'</nav></div><div class="github-footer"><a href="https://github.com/Mindful-AI-Research" target="_blank" rel="noopener noreferrer"><img src="https://img.shields.io/badge/GitHub%20%C2%B7%20%E0%A5%90%20Mindful%20AI%20%E2%8B%86%20Research%20%26%20Consulting%20%F0%96%A4%90-07111F?style=for-the-badge&logo=github&logoColor=white&labelColor=3A424C" alt="GitHub · ॐ Mindful AI ⋆ Research & Consulting 𖤐"></a></div></footer>';function go(n){idx=Math.max(0,Math.min(13,n));render()}document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('pt').onclick=()=>{lang='pt';render()};document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';render()};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();document.getElementById('home').onclick=()=>go(0);document.getElementById('back').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('restart').onclick=()=>go(0);document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>go(+x.dataset.i));var cp=document.getElementById('copy');if(cp)cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);cp.textContent=en?'Copied':'Copiado';setTimeout(()=>cp.textContent=en?'Copy code':'Copiar código',1300)};document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-a]').forEach(y=>y.classList.remove('active'));x.classList.add('active');var ok=x.dataset.a==='a',f=document.getElementById('feedback');f.textContent=ok?(en?'Correct — report 0.76. best_score_ selected; the untouched test measured.':'Correto — reporte 0,76. best_score_ escolheu; o teste intocado mediu.'):(en?'Try again — the protected test result is the final reportable number.':'Tente outra vez — o resultado do teste protegido é o número final reportável.');f.className='feedback '+(ok?'ok':'no')})}function move(n){idx=Math.max(0,Math.min(13,idx+n));render()}window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key==='Home'){idx=0;render()}else if(e.key==='End'){idx=13;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}});document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{var d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:true});render()})();
