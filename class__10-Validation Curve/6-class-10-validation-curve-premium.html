<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 10 · Validation Curve · Mindful AI — Revised</title><style>*{box-sizing:border-box}body{--bg:#03070c;--panel:#101f2f;--text:#edf4f7;--muted:#b0c4d3;--line:#243f50;--teal:#6cddcc;margin:0;background:var(--bg);color:var(--text);font:300 17px system-ui}body.light{--bg:#edf4f5;--panel:#fff;--text:#123445;--muted:#456174;--line:#c4d8df;--teal:#087666}header,footer{padding:17px 3vw;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:11px;cursor:pointer;font:inherit;font-size:13px}button:hover,button.active{color:var(--teal);border-color:var(--teal)}button:disabled{opacity:.35}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:3px}main{display:grid;grid-template-columns:175px 1fr;min-height:calc(100svh - 145px)}aside{border-right:1px solid var(--line);padding:22px 10px;display:flex;flex-direction:column;gap:6px}aside button{text-align:left;font-size:11px;background:none;border-color:transparent}article{padding:36px 4vw;animation:enter .3s;max-width:1400px;width:100%;margin:auto}h1{font-size:clamp(32px,4vw,58px);font-weight:250;letter-spacing:-.04em;line-height:1.1;margin:20px 0}h2{font-weight:350;font-size:21px;line-height:1.4}p{line-height:1.7;color:var(--muted)}.intro{max-width:950px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.2em}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:26px 0}.card{border:1px solid var(--line);background:linear-gradient(140deg,var(--panel),var(--bg));padding:24px;border-radius:21px}.card p{font-size:15px}.step{font-size:11px;color:var(--teal);letter-spacing:.12em}.diagram{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:20px;border:1px solid var(--line);border-radius:16px;color:var(--teal);margin:20px 0}.diagram span{flex:1;text-align:center;min-width:100px;padding:14px;background:var(--panel);border-radius:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:20px}svg{width:100%;max-height:290px}svg text{fill:var(--muted);font-size:12px}input{width:100%;accent-color:var(--teal)}.metrics{color:var(--teal);margin:15px 0}.quiz{display:grid;gap:12px;margin-top:25px}.quiz button{text-align:left;padding:20px;font-size:16px}.folds{display:flex;gap:12px;margin:25px 0}.folds div{flex:1;padding:20px 5px;border:1px solid var(--line);border-radius:14px;text-align:center}.folds .active{background:var(--panel);border-color:var(--teal);color:var(--teal)}a{color:var(--teal);text-decoration:none}footer{border-top:1px solid var(--line);font-size:12px}.progress{position:fixed;top:0;left:0;height:3px;background:var(--teal);transition:width .3s;z-index:4}.notice{font-size:12px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:25px}dialog::backdrop{background:#0009}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1050px){aside{display:none}main{display:block}}@media(max-width:700px){.cards{grid-template-columns:1fr}.card{padding:20px}header,footer{flex-wrap:wrap}article{padding:28px 20px}h1{font-size:36px}.folds{gap:5px}.folds div{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="progress" id="progress"></div><header><span>ॐ Mindful AI · Class 10</span><div><button id="en">🇬🇧 EN</button> <button id="pt">🇧🇷 PT</button> <button id="theme" aria-label="Theme">◐</button> <button id="full" aria-label="Fullscreen">⛶</button> <button id="help" aria-label="Keyboard shortcuts">?</button></div></header><main><aside aria-label="Slide index"></aside><article id="slide"></article></main><footer><button id="reset"></button><div><button id="prev"></button> <span id="count" aria-live="polite"></span> <button id="next"></button></div><a href="https://github.com/Mindful-AI-Research" target="_blank" rel="noopener noreferrer">ॐ Mindful AI ⋆ Research & Consulting ↗</a></footer><dialog id="keys"><h2>Keyboard / Teclado</h2><p>← → · Previous / next<br>Home / End · First / last<br>F · Fullscreen<br>Esc · Close</p><button id="close">Close / Fechar</button></dialog><script>const S=[["Class 10 · Validation Curve", "Aula 10 · Curva de validação", "Evaluate with evidence. Select with care.", "Avalie com evidência. Selecione com cuidado.", [["01 · Explore", "Compare training and validation as complexity changes.", "Compare treino e validação quando a complexidade muda."], ["02 · Diagnose", "Investigate underfitting, overfitting and fold variability.", "Investigue subajuste, sobreajuste e variação entre dobras."], ["03 · Protect", "Separate model selection from independent evaluation.", "Separe seleção de modelos da avaliação independente."]]], ["One parameter. Two perspectives.", "Um parâmetro. Duas perspectivas.", "A validation curve varies one hyperparameter; other settings and the available training data remain fixed.", "Uma curva de validação varia um hiperparâmetro; os demais ajustes e os dados de treino disponíveis permanecem fixos.", [["Horizontal axis / Eixo horizontal", "Candidate values: for example max_depth = 1, 3, 5, 10. Depth controls the flexibility of a decision tree.", "Valores candidatos: por exemplo max_depth = 1, 3, 5, 10. A profundidade controla a flexibilidade de uma árvore."], ["Training / Treino", "For each candidate and each fold, fit on the training portion and measure performance on that same portion.", "Para cada candidato e dobra, ajuste na porção de treino e meça o desempenho nessa mesma porção."], ["Validation / Validação", "Measure the fitted model on the held-out fold. Aggregate across folds to compare candidates.", "Meça o modelo ajustado na dobra retida. Agregue as notas entre dobras para comparar candidatos."]]], ["Move complexity. Read the gap.", "Mova a complexidade. Leia a diferença.", "Interactive schematic. Scores are synthetic illustrations, not measured results.", "Esquema interativo. Notas são ilustrações sintéticas, não resultados medidos.", []], ["Low + low: investigate underfitting.", "Baixo + baixo: investigue subajuste.", "A small training–validation gap does not guarantee a useful model. Compare against a meaningful baseline.", "Uma diferença pequena entre treino e validação não garante um modelo útil. Compare com um baseline significativo.", [["Pattern / Padrão", "Both scores are low relative to your task requirements or baseline. The model may not capture useful structure.", "Ambas as notas são baixas frente às exigências da tarefa ou ao baseline. O modelo pode não captar estrutura útil."], ["Hypothesis / Hipótese", "Insufficient flexibility is one explanation. Weak features, noisy labels or a mismatched metric are alternatives.", "Pouca flexibilidade é uma explicação. Atributos fracos, rótulos ruidosos ou métrica inadequada são alternativas."], ["Next experiment / Próximo experimento", "Increase capacity cautiously, inspect feature quality, and repeat the same protected validation design.", "Aumente a capacidade com cuidado, examine os atributos e repita o mesmo desenho protegido de validação."]]], ["High training. Weaker validation.", "Treino alto. Validação inferior.", "A widening gap can signal overfitting; it is a warning to investigate, not an automatic diagnosis.", "Uma diferença crescente pode sinalizar sobreajuste; é um alerta para investigar, não um diagnóstico automático.", [["Pattern / Padrão", "Training continues to improve while validation stops improving or deteriorates. Extra flexibility may fit sample-specific noise.", "O treino continua melhorando enquanto a validação estabiliza ou piora. Flexibilidade extra pode ajustar ruído específico da amostra."], ["Check first / Examine antes", "Inspect fold variability, leakage, entity overlap and time-dependent splits. An inappropriate split can invalidate the comparison.", "Examine variação entre dobras, vazamento, sobreposição de entidades e divisões temporais. Uma divisão inadequada pode invalidar a comparação."], ["Possible response / Possível resposta", "Try a shallower tree or stronger regularization when appropriate. Keep the metric and validation design fixed for the comparison.", "Experimente árvore menos profunda ou regularização maior quando apropriado. Mantenha métrica e desenho de validação fixos na comparação."]]], ["Uncertainty belongs on the plot.", "A incerteza faz parte do gráfico.", "Summarize each candidate across folds. A standard-deviation band is not automatically a confidence interval.", "Resuma cada candidato entre dobras. Uma faixa de desvio-padrão não é automaticamente um intervalo de confiança.", [["Mean / Média", "The mean summarizes performance across the chosen folds, but hides individual fold behavior.", "A média resume desempenho nas dobras escolhidas, mas oculta o comportamento individual."], ["Variation / Variação", "A large spread warns that performance depends on the split. Inspect scores and data composition before selecting.", "Uma grande dispersão alerta que o desempenho depende da divisão. Examine notas e composição dos dados antes de selecionar."], ["Interpretation / Interpretação", "Overlapping bands do not prove equivalence. A simplicity preference is a selection rule, not a significance test.", "Faixas sobrepostas não provam equivalência. Preferir simplicidade é uma regra de seleção, não um teste de significância."]]], ["Selection is not final evaluation.", "Seleção não é avaliação final.", "The test partition must not choose the hyperparameter. Preserve independence throughout the workflow.", "A partição de teste não deve escolher o hiperparâmetro. Preserve a independência em todo o processo.", [["01 · Split / Dividir", "Reserve a test partition before tuning. Use group-aware or temporal splits when the task requires them.", "Reserve uma partição de teste antes do ajuste. Use divisões por grupos ou temporais quando a tarefa exigir."], ["02 · Select / Selecionar", "Run the validation curve only on the training partition. Choose a candidate using a predefined metric and rule.", "Execute a curva apenas na partição de treino. Escolha um candidato com métrica e regra predefinidas."], ["03 · Confirm / Confirmar", "Refit the chosen configuration on all training data. Evaluate on the untouched test set; do not tune after viewing that score.", "Reajuste a configuração em todo o treino. Avalie no teste intocado; não ajuste após observar essa nota."]]], ["Validation curve ≠ learning curve.", "Curva de validação ≠ curva de aprendizado.", "Read the horizontal axis before interpreting the shape. These plots answer different questions.", "Leia o eixo horizontal antes de interpretar o formato. Esses gráficos respondem a perguntas diferentes.", [["Validation curve / Curva de validação", "X: one hyperparameter. Question: how does this setting affect fit and held-out performance? Example: tree depth from 1 to 15.", "X: um hiperparâmetro. Pergunta: como esse ajuste afeta treino e desempenho retido? Exemplo: profundidade de 1 a 15."], ["Learning curve / Curva de aprendizado", "X: training sample count. Question: how do scores change as more training data become available? Hold model settings fixed.", "X: quantidade de amostras de treino. Pergunta: como as notas mudam com mais dados? Mantenha as configurações do modelo fixas."], ["Shared caution / Cuidado comum", "Both compare training and validation, but neither replaces independent final evaluation or proves that more data or capacity will help.", "Ambas comparam treino e validação, mas nenhuma substitui avaliação final independente nem prova que mais dados ou capacidade ajudarão."]]], ["Make the decision.", "Tome a decisão.", "Hypothetical example: training = 0.99, validation = 0.70. Which interpretation is defensible?", "Exemplo hipotético: treino = 0,99, validação = 0,70. Qual interpretação é defensável?", []], ["Report a defensible conclusion.", "Relate uma conclusão defensável.", "A strong report explains how the score was obtained, not just which candidate won.", "Um bom relatório explica como a nota foi obtida, não apenas qual candidato venceu.", [["Experiment / Experimento", "Record data scope, metric, candidate values, fixed settings, fold strategy and random seed. Fit preprocessing inside the appropriate training folds.", "Registre escopo dos dados, métrica, candidatos, ajustes fixos, estratégia de dobras e seed. Ajuste pré-processamento nas dobras de treino apropriadas."], ["Selection evidence / Evidência de seleção", "Report training and validation means, fold variability and the selection rule. State whether the winner lies at a search boundary.", "Relate médias de treino e validação, variação entre dobras e regra de seleção. Declare se o vencedor está no limite da busca."], ["Final claim / Conclusão final", "Report the independent test metric separately. Describe limitations and avoid presenting the winning CV score as an unbiased final estimate.", "Relate separadamente a métrica de teste independente. Descreva limitações e não trate a melhor nota de CV como estimativa final sem viés."]]], ["Sources & scope", "Fontes e escopo", "Educational presentation for Class 10. No measured course results are claimed.", "Apresentação educacional para a Aula 10. Não se afirmam resultados medidos da disciplina.", [["Technical references / Referências técnicas", "scikit-learn documentation: validation and learning curves; cross-validation. Links below.", "Documentação do scikit-learn: curvas de validação e aprendizado; validação cruzada. Links abaixo."], ["Simulator / Simulador", "Synthetic curves for conceptual exploration. No model is fitted by this HTML.", "Curvas sintéticas para exploração conceitual. Este HTML não ajusta modelos."], ["Material / Material", "Independently authored teaching content, not a verbatim reproduction of the uploaded slides.", "Conteúdo didático elaborado independentemente, não reprodução literal dos slides anexados."]]]];let n=0,l=0,d=6,f=0;const $=s=>document.querySelector(s);function draw(){document.documentElement.lang=l?'pt':'en';let s=S[n];$('#slide').innerHTML='<div class="eyebrow">MINDFUL AI · CLASS 10 · '+String(n+1).padStart(2,'0')+'</div><h1>'+s[l]+'</h1><p class="intro">'+s[l+2]+'</p>';if(s[4].length)$('#slide').insertAdjacentHTML('beforeend','<div class="cards">'+s[4].map((c,i)=>'<section class="card"><div class="step">0'+(i+1)+'</div><h2>'+c[0]+'</h2><p>'+c[l+1]+'</p></section>').join('')+'</div>');if([1,3,4,6,7,9].includes(n)){let a={1:l?['Candidatos','Treinar por dobra','Validar','Comparar']:['Candidates','Fit each fold','Validate','Compare'],3:l?['Treino baixo','Validação baixa','Investigar estrutura']:['Low training','Low validation','Investigate structure'],4:l?['Treino sobe','Validação estagna','Investigar diferença']:['Training rises','Validation stalls','Investigate gap'],6:l?['Reservar teste','Selecionar com CV','Reajustar treino','Teste final']:['Reserve test','Select with CV','Refit training','Final test'],7:l?['Validação → hiperparâmetro','Aprendizado → amostras']:['Validation → hyperparameter','Learning → samples'],9:l?['Método','Variabilidade','Regra de seleção','Teste independente']:['Method','Variability','Selection rule','Independent test']}[n];$('#slide').insertAdjacentHTML('beforeend','<div class="diagram">'+a.map(v=>'<span>'+v+'</span>').join('<b aria-hidden="true">→</b>')+'</div>')}if(n===2){$('#slide').insertAdjacentHTML('beforeend','<div class="panel"><svg id="chart" viewBox="0 0 680 300" role="img" aria-label="Synthetic training and validation curve"></svg><div class="metrics" id="metrics" aria-live="polite"></div><label for="depth">'+(l?'Complexidade ilustrativa':'Illustrative complexity')+'</label><input id="depth" type="range" min="1" max="15" value="'+d+'"><p class="notice">'+(l?'Teal: treino · Azul: validação · Notas sintéticas.':'Teal: training · Blue: validation · Synthetic scores.')+'</p></div>');chart();$('#depth').oninput=e=>{d=+e.target.value;chart()}}if(n===5){$('#slide').insertAdjacentHTML('beforeend','<div class="folds" id="folds"></div><button id="rotate">'+(l?'Alternar dobra →':'Rotate fold →')+'</button><p class="notice">'+(l?'Ilustração de cinco dobras, sem cálculo de notas.':'Illustration of five folds, no score calculation.')+'</p>');folds();$('#rotate').onclick=()=>{f=(f+1)%5;folds()}}if(n===8){let a=l?['O modelo está pronto porque o treino é alto.','A diferença pode indicar sobreajuste; investigue a avaliação.','O teste deve escolher o hiperparâmetro.']:['The model is ready because training is high.','The gap may suggest overfitting; investigate the evaluation.','The test should choose the hyperparameter.'];$('#slide').insertAdjacentHTML('beforeend','<div class="quiz">'+a.map((v,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+' · '+v+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>$('#feedback').textContent=+b.dataset.answer===1?(l?'Correto. A diferença motiva investigação, não diagnóstico automático.':'Correct. The gap motivates investigation, not an automatic diagnosis.'):(l?'Tente novamente. Treino não é avaliação independente.':'Try again. Training is not independent evaluation.'))}if(n===10)$('#slide').insertAdjacentHTML('beforeend','<div class="panel"><p><a href="https://scikit-learn.org/stable/modules/learning_curve.html" target="_blank" rel="noopener noreferrer">scikit-learn · Validation & learning curves ↗</a></p><p><a href="https://scikit-learn.org/stable/modules/cross_validation.html" target="_blank" rel="noopener noreferrer">scikit-learn · Cross-validation ↗</a></p></div>');$('aside').innerHTML=S.map((s,i)=>'<button data-slide="'+i+'" class="'+(n===i?'active':'')+'">'+String(i+1).padStart(2,'0')+' · '+s[l]+'</button>').join('');document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{n=+b.dataset.slide;draw()});$('#count').textContent=(n+1)+' / '+S.length;$('#progress').style.width=((n+1)/S.length*100)+'%';$('#prev').textContent=l?'← Voltar':'← Back';$('#next').textContent=l?'Avançar →':'Next →';$('#reset').textContent=l?'↺ Reiniciar':'↺ Restart';$('#prev').disabled=n===0;$('#next').disabled=n===S.length-1;$('#en').classList.toggle('active',!l);$('#pt').classList.toggle('active',!!l)}function vals(x){return [.54+.46*(1-Math.exp(-x/3.3)),.57+.27*(1-Math.exp(-x/2.5))-.0018*Math.max(0,x-6)**2]}function chart(){const x=v=>55+(v-1)*41,y=v=>250-(v-.45)/.55*220;let g='';for(let v of [.5,.6,.7,.8,.9,1])g+='<line x1="55" x2="640" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="12" y="'+(y(v)+4)+'">'+v.toFixed(1)+'</text>';for(let v of [1,4,7,10,13,15])g+='<text x="'+x(v)+'" y="280">'+v+'</text>';for(let k of [0,1])g+='<path d="'+Array.from({length:15},(_,i)=>(i?'L':'M')+x(i+1)+','+y(vals(i+1)[k])).join(' ')+'" fill="none" stroke="'+(k?'#739cff':'var(--teal)')+'" stroke-width="3"/>';g+='<line x1="'+x(d)+'" x2="'+x(d)+'" y1="25" y2="255" stroke="var(--muted)" stroke-dasharray="4 5"/>';vals(d).forEach((v,k)=>g+='<circle cx="'+x(d)+'" cy="'+y(v)+'" r="6" fill="'+(k?'#739cff':'var(--teal)')+'"/>');$('#chart').innerHTML=g;$('#metrics').textContent=(l?'Complexidade: ':'Complexity: ')+d+' · '+(l?'Treino: ':'Training: ')+vals(d)[0].toFixed(3)+' · '+(l?'Validação: ':'Validation: ')+vals(d)[1].toFixed(3)}function folds(){$('#folds').innerHTML=Array.from({length:5},(_,i)=>'<div class="'+(i===f?'active':'')+'">'+(i+1)+'<br>'+(i===f?(l?'Validar':'Validate'):(l?'Treinar':'Train'))+'</div>').join('')}function go(v){n=Math.max(0,Math.min(S.length-1,n+v));draw();window.scrollTo(0,0)}$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);$('#reset').onclick=()=>{n=0;d=6;f=0;draw()};$('#en').onclick=()=>{l=0;draw()};$('#pt').onclick=()=>{l=1;draw()};$('#theme').onclick=()=>document.body.classList.toggle('light');$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#full').textContent=l?'Indisponível':'Unavailable'}};$('#help').onclick=()=>$('#keys').showModal();$('#close').onclick=()=>$('#keys').close();addEventListener('keydown',e=>{if($('#keys').open||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='Home'){n=0;draw()}if(e.key==='End'){n=S.length-1;draw()}if(e.key.toLowerCase()==='f')$('#full').click()});let start=null;$('#slide').addEventListener('touchstart',e=>{start=e.target.closest('input,button,a')?null:[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('#slide').addEventListener('touchend',e=>{if(!start)return;let dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1];if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);start=null},{passive:true});draw();</script></body></html>
