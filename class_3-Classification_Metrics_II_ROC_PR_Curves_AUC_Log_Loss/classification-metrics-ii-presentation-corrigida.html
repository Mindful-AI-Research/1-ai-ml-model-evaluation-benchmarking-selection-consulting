<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classification Metrics II</title><style>body{margin:0;background:#08090b;color:#fff;font-family:Arial,sans-serif}.top,.bottom{position:fixed;z-index:2;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;background:#08090cdd}.top{top:0}.bottom{bottom:0;gap:12px}button{background:#102031;color:#fff;border:1px solid #315064;border-radius:22px;padding:10px 15px;cursor:pointer}button:hover:not(:disabled),.active{color:#22d3ee;border-color:#22d3ee}button:disabled{opacity:.35;cursor:not-allowed}main{width:min(1100px,88vw);margin:auto;padding:90px 0}.slide{min-height:78vh;display:flex;flex-direction:column;justify-content:center}.k{color:#22d3ee;font:12px monospace;letter-spacing:2px}.title{font-size:clamp(40px,7vw,88px);line-height:1.03;margin:18px 0}.lead{font-size:clamp(18px,2.2vw,27px);line-height:1.5;color:#aab7c4;max-width:850px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.card{padding:22px;border:1px solid #294257;border-radius:18px;background:#101a27}.card h3{color:#22d3ee}.card p{color:#aab7c4;line-height:1.5}.flow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:30px}.node{border:1px solid #287d91;border-radius:12px;padding:14px;background:#10263a}.arrow{color:#22d3ee;font-size:24px}.formula{font:18px/1.8 monospace;background:#050608;border:1px solid #173b4a;padding:18px;border-radius:14px;margin-top:22px}.chart{height:260px;margin-top:28px;border-left:2px solid #8190a2;border-bottom:2px solid #8190a2;position:relative;background:linear-gradient(135deg,transparent 49.5%,#67788a 50%,transparent 50.5%)}.curve{position:absolute;inset:0;background:#06b6d455;clip-path:polygon(0 100%,4% 50%,12% 32%,25% 22%,45% 13%,70% 7%,100% 0,100% 100%)}.x,.y{position:absolute;color:#aab7c4;font:12px monospace}.x{right:4px;bottom:-24px}.y{left:-28px;top:5px;transform:rotate(-90deg)}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:14px;text-align:left;border-bottom:1px solid #294257}td{color:#aab7c4}.progress{height:3px;background:#294257;flex:1}.progress i{display:block;height:100%;background:#22d3ee}@media(max-width:700px){.grid{grid-template-columns:1fr}.top small{display:none}main{width:88vw}.slide{min-height:75vh}.bottom{padding:10px 4vw}}</style><body><header class="top"><small>AI / ML · MODEL EVALUATION</small><div><button id="en">🇬🇧 English</button><button id="pt" class="active">🇧🇷 Português</button><button id="fs">⛶</button></div></header><main id="main"></main><footer class="bottom"><button id="back">← <span id="bt">Voltar</span></button><div class="progress"><i id="bar"></i></div><button id="next"><span id="nt">Avançar</span> →</button></footer><script>const P={pt:[['Métricas de classificação II','Curvas ROC e PR · AUC · log-loss','Aula 03 · 18/08/2026','cover'],['A nota ainda não é a decisão','Um filtro de spam devolve uma pontuação: quanto maior, maior a suspeita de spam.','Score → ranking → limiar','score'],['Duas perguntas independentes','A ordenação do modelo é diferente da decisão em um limiar específico.','Escolha da métrica','two'],['ROC: varrendo todos os limiares','Recall contra falso alarme. Cada limiar produz um ponto na curva.','Receiver Operating Characteristic','roc'],['AUC: resumindo o ranking','A área sob a ROC mede a qualidade da ordenação sem depender de um único corte.','Area Under the Curve','auc'],['Quando o positivo é raro','A curva Precision–Recall concentra a análise nos alarmes positivos e em sua correção.','PR e AP','pr'],['Log-loss: a probabilidade é confiável?','A métrica pune o erro confiante. Menor é melhor.','Qualidade probabilística','loss'],['A métrica nasce da pergunta','O objetivo determina o instrumento de avaliação.','Decisão de avaliação','table'],['O que a aula demonstrou','Um exemplo conceitual de filtro de spam, com pontuações, limiar, matriz de confusão e curvas.','Limites do material','boundary'],['Da aula para a prática','Avaliar em dados separados, explicitar custos de erros e verificar a calibração.','Extensão recomendada','next']],en:[['Classification Metrics II','ROC and PR curves · AUC · log-loss','Class 03 · 18 Aug 2026','cover'],['A score is not yet a decision','A spam filter returns a score: the higher it is, the stronger the suspicion of spam.','Score → ranking → threshold','score'],['Two independent questions','Model ranking is different from a decision at one specific threshold.','Metric selection','two'],['ROC: scanning every threshold','Recall versus false-alarm rate. Each threshold produces one point on the curve.','Receiver Operating Characteristic','roc'],['AUC: summarizing ranking','The area under ROC measures ordering quality without depending on one operating threshold.','Area Under the Curve','auc'],['When the positive is rare','The Precision–Recall curve focuses on positive alarms and their correctness.','PR and AP','pr'],['Log-loss: are probabilities reliable?','The metric penalizes confident mistakes. Lower is better.','Probabilistic quality','loss'],['The question determines the metric','The objective determines the evaluation instrument.','Evaluation decision','table'],['What the class demonstrated','A conceptual spam-filter example with scores, threshold, confusion matrix, and curves.','Material boundaries','boundary'],['From class to practice','Evaluate held-out data, explicit error costs, and calibration.','Recommended extension','next']]};let L='pt',i=0,$=x=>document.getElementById(x);function V(t){if(t==='cover')return '<div class="grid"><div class="card"><h3>Ranking</h3><p>Does the score rank cases well?</p></div><div class="card"><h3>ROC / AUC</h3><p>0.5 → 1.0</p></div><div class="card"><h3>PR / AP</h3><p>Honest view for rare positives.</p></div></div>';if(t==='score')return '<div class="flow"><div class="node">Email</div><b class="arrow">→</b><div class="node">Score 0–100</div><b class="arrow">→</b><div class="node">Rank</div><b class="arrow">→</b><div class="node">Threshold</div></div>';if(t==='two')return '<div class="grid"><div class="card"><h3>Ranking</h3><p>Positives above negatives?<br>ROC · AUC · PR · AP</p></div><div class="card"><h3>Decision</h3><p>Errors at the selected threshold?<br>precision · recall · F1</p></div></div>';if(t==='roc'||t==='pr')return '<div class="chart"><div class="curve"></div><span class="x">'+(t==='roc'?'FPR':'recall')+'</span><span class="y">'+(t==='roc'?'TPR':'precision')+'</span></div><div class="formula">'+(t==='roc'?'TPR = TP/(TP+FN) · FPR = FP/(FP+TN)':'Precision = TP/(TP+FP) · Recall = TP/(TP+FN)')+'</div>';if(t==='auc')return '<div class="grid"><div class="card"><h3>0.5</h3><p>chance / acaso</p></div><div class="card"><h3>0.80</h3><p>Positive scores are higher in 80% of pairs.</p></div><div class="card"><h3>1.0</h3><p>perfect ranking</p></div></div>';if(t==='loss')return '<div class="formula">ℓ(y,p) = −[ y·log(p) + (1−y)·log(1−p) ]</div><div class="grid"><div class="card"><h3>p = 0.9 → 0.11</h3><p>Correct confident prediction.</p></div><div class="card"><h3>p = 0.1 → 2.30</h3><p>Confident error.</p></div></div>';if(t==='table')return '<table><tr><th>Question</th><th>Metric</th></tr><tr><td>Rank without threshold</td><td>AUC (ROC)</td></tr><tr><td>Rare positives</td><td>AP (PR) + recall</td></tr><tr><td>Reliable probabilities</td><td>log-loss</td></tr></table>';if(t==='boundary')return '<div class="grid"><div class="card"><h3>Demonstrated</h3><p>Spam, scores, threshold, confusion matrix, curves.</p></div><div class="card"><h3>Conceptual</h3><p>Disease, fraud, and credit.</p></div><div class="card"><h3>Not provided</h3><p>Dataset, executed code, and benchmark.</p></div></div>';return '<div class="flow"><div class="node">Held-out data</div><b class="arrow">→</b><div class="node">FP/FN costs</div><b class="arrow">→</b><div class="node">Calibration</div></div>'}function render(){let s=P[L][i];$('main').innerHTML='<section class="slide"><div class="k">'+s[2]+' · '+(i+1)+'/'+P[L].length+'</div><h1 class="title">'+s[0]+'</h1><p class="lead">'+s[1]+'</p>'+V(s[3])+'</section>';$('bar').style.width=((i+1)/P[L].length*100)+'%';$('back').disabled=i===0;$('next').disabled=i===P[L].length-1}function go(n){i=Math.max(0,Math.min(P[L].length-1,n));render()}$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('en').onclick=()=>{L='en';i=0;$('en').classList.add('active');$('pt').classList.remove('active');$('bt').textContent='Back';$('nt').textContent='Next';render()};$('pt').onclick=()=>{L='pt';i=0;$('pt').classList.add('active');$('en').classList.remove('active');$('bt').textContent='Voltar';$('nt').textContent='Avançar';render()};$('fs').onclick=()=>document.documentElement.requestFullscreen?.();onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')go(i+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);if(e.key==='Home')go(0);if(e.key==='End')go(P[L].length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()};let sx=0;ontouchstart=e=>sx=e.touches[0].clientX;ontouchend=e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>45)go(i+(d<0?1:-1))};render();</script></body></html>
