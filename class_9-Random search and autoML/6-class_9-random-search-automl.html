<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 09 · Random Search & AutoML</title><style>:root{--bg:#07111f;--card:#0f172a;--line:#244052;--text:#f8fafc;--muted:#b8c4d3;--accent:#2dd4bf;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#0f4f4d55,transparent 30rem),var(--bg);color:var(--text);min-height:100vh;overflow:hidden}.top{position:fixed;top:0;left:0;right:0;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;z-index:4}.brand{font-weight:800}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.tool{background:#102334;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.slide{min-height:100vh;padding:100px clamp(24px,8vw,130px) 90px;display:flex;align-items:center;justify-content:center}.box{width:min(1180px,100%);padding:clamp(32px,5vw,76px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#0f172af0,#102b39cf);box-shadow:0 28px 80px #0008}.tag{display:inline-block;color:#99f6e4;border:1px solid #2dd4bf66;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(2.6rem,7vw,7rem);line-height:.94;letter-spacing:-.07em;margin:24px 0}h1 em{display:block;color:var(--accent);font-style:normal}h2{font-size:clamp(2rem,4.8vw,4.6rem);letter-spacing:-.06em;line-height:1;margin:12px 0 20px}p{max-width:850px;color:var(--muted);font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.item{padding:20px;border:1px solid var(--line);border-radius:18px;background:#0a1b2a99}.item strong{font-size:18px}.item p{font-size:14px}.arrows{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:grid;gap:12px;z-index:6}.arrow{width:58px;height:58px;border:1px solid #3b6273;border-radius:16px;background:#0d2434e8;color:white;font-size:38px;line-height:1;cursor:pointer;box-shadow:0 12px 32px #0007}.arrow:hover{border-color:var(--accent);color:var(--accent)}.bottom{position:fixed;left:28px;right:28px;bottom:22px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.track{height:5px;width:min(52vw,640px);background:#233746;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#14b8a6,#5eead4);transition:width .25s}.formula{font-family:ui-monospace,monospace;color:#ccfbf1;padding:25px;border:1px solid #2dd4bf55;border-radius:18px;background:#0f766e22;font-size:clamp(1.4rem,3vw,3rem);text-align:center;margin-top:26px}.table{margin-top:26px;overflow:auto;border:1px solid var(--line);border-radius:16px}.table table{width:100%;min-width:650px;border-collapse:collapse}.table th,.table td{padding:15px;text-align:left;border-bottom:1px solid var(--line);color:var(--muted)}.table th{color:#99f6e4;background:#0f766e22}.table td strong{color:var(--text)}@media(max-width:800px){.grid{grid-template-columns:1fr}.arrows{right:12px}.arrow{width:48px;height:48px}.top{padding:14px}.bottom{left:14px;right:14px}.slide{padding:85px 18px 80px}.box{padding:28px 22px}}</style></head><body><header class="top"><div class="brand">Class 09 · Data Science<span>Random Search & AutoML</span></div><div><button class="tool" id="lang">🇬🇧 English / 🇧🇷 Português</button><button class="tool" id="home">⌂</button></div></header><main id="deck"></main><aside class="arrows"><button class="arrow" id="prev" aria-label="Previous slide">‹</button><button class="arrow" id="next" aria-label="Next slide">›</button></aside><footer class="bottom"><div class="track"><div class="bar" id="bar"></div></div><div id="counter"></div></footer><script>const en=[['Model Evaluation · Benchmarking · Selection','Random Search','and AutoML','A practical framework for hyperparameter optimization, cross-validation, stability-aware model selection, and responsible automation.'],['01 · Overview','Optimize with evidence — not just the best score.','','Hyperparameter tuning is a model-selection process. Reliable conclusions require suitable search spaces, a valid evaluation design, meaningful metrics, and transparent final reporting.','Grid Search|Exhaustively evaluates combinations; cost grows multiplicatively.','Random Search|Samples configurations under a fixed compute budget.','AutoML|Automates portions of experimentation, not judgment.'],['02 · Strategy comparison','Search strategies: different ways to allocate compute.','','','TABLE'],['03 · Search spaces','A search is only as good as its search space.','','Match distributions to parameter type and expected scale.','randint|Whole-number choices such as tree depth.','uniform|Linear continuous ranges; scale is interval width.','loguniform|Values spanning orders of magnitude.'],['04 · Probability','Choosing a search budget with probability.','','If a promising region represents p of the space, repeated random trials increase the probability of sampling it.','FORMULA'],['05 · Pipeline safety','The evaluation pipeline protects the experiment.','','Fit preprocessing only inside the training portion of each validation fold.','Dataset|Features and binary target','Validation|Stratified folds or suitable split','Safe pipeline|Preprocessing inside each fold'],['06 · Model selection','Select configurations for stability, not only rank.','','Inspect mean CV performance, variability, plateaus, simplicity, and computational cost.','Average Precision|Useful precision–recall summary for some imbalanced tasks.','μ ± σ|Mean and variation across folds should be reported.','Plateaus|Prefer stable configurations over isolated maxima.'],['07 · Final evaluation','Protect the final estimate from tuning bias.','','Use nested cross-validation or a final holdout set untouched during development.','Inner loop|Select hyperparameters.','Outer loop|Estimate generalization.','Final holdout|Evaluate once after tuning.'],['08 · Implementation','Copy/paste reference implementation.','','Reference code must be labelled separately from original classroom source code.','RandomizedSearchCV|Fixed n_iter and distributions.','StratifiedKFold|Consistent class proportions.','Average Precision|Search scoring metric.'],['09 · AutoML','AutoML changes workflow speed — not accountability.','','AutoML can automate preprocessing, model selection, tuning, and tracking. It cannot validate objectives, data quality, split validity, or social impact.'],['10 · Conclusion','From search to trustworthy selection.','','Define valid spaces, separate selection from final estimation, and report uncertainty—not only best parameters.']];const pt=[['Avaliação · Benchmarking · Seleção','Random Search','e AutoML','Um framework prático para otimização de hiperparâmetros, validação cruzada, seleção orientada à estabilidade e automação responsável.'],['01 · Visão geral','Otimize com evidências — não apenas pelo melhor score.','','O ajuste de hiperparâmetros é um processo de seleção de modelos. Conclusões confiáveis exigem espaços adequados, avaliação válida, métricas relevantes e reporte transparente.','Grid Search|Avalia combinações; o custo cresce multiplicativamente.','Random Search|Amostra configurações sob orçamento fixo.','AutoML|Automatiza partes da experimentação, não o julgamento.'],['02 · Comparação','Estratégias de busca: diferentes formas de alocar computação.','','','TABLE'],['03 · Espaços de busca','Uma busca é tão boa quanto seu espaço de busca.','','Associe distribuições ao tipo do parâmetro e sua escala esperada.','randint|Escolhas inteiras, como profundidade da árvore.','uniform|Intervalos contínuos lineares.','loguniform|Valores por ordens de grandeza.'],['04 · Probabilidade','Escolhendo o orçamento de busca com probabilidade.','','Se uma região promissora representa p do espaço, testes aleatórios aumentam a chance de amostrá-la.','FORMULA'],['05 · Segurança','O pipeline de avaliação protege o experimento.','','Ajuste pré-processamento apenas na parte de treino de cada fold de validação.','Dataset|Atributos e alvo binário','Validação|Folds estratificados ou split adequado','Pipeline seguro|Pré-processamento dentro de cada fold'],['06 · Seleção','Selecione configurações por estabilidade, não apenas por ranking.','','Analise média na CV, variabilidade, platôs, simplicidade e custo computacional.','Average Precision|Resumo precision–recall para algumas tarefas desbalanceadas.','μ ± σ|Média e variação entre folds.','Platôs|Prefira configurações estáveis.'],['07 · Avaliação final','Proteja a estimativa final contra viés de tuning.','','Use nested cross-validation ou um holdout final não tocado durante o desenvolvimento.','Loop interno|Seleciona hiperparâmetros.','Loop externo|Estima generalização.','Holdout final|Avalia após o tuning.'],['08 · Implementação','Implementação de referência para copiar e colar.','','Código de referência deve ser identificado separadamente do código original da aula.','RandomizedSearchCV|n_iter e distribuições.','StratifiedKFold|Proporções de classe consistentes.','Average Precision|Métrica de busca.'],['09 · AutoML','AutoML muda a velocidade — não a responsabilidade.','','AutoML pode automatizar pré-processamento, seleção, tuning e tracking. Ele não valida objetivos, qualidade dos dados, splits ou impacto social.'],['10 · Conclusão','Da busca à seleção confiável.','','Defina espaços válidos, separe seleção de estimação final e reporte incerteza — não apenas os melhores parâmetros.']];let language='en',i=0,start=null;function data(){return language==='en'?en:pt}function render(){const s=data()[i],hero=i===0;let x='<section class="slide"><article class="box">';x+=hero?'<div class="tag">'+s[0]+'</div><h1>'+s[1]+'<em>'+s[2]+'</em></h1><p>'+s[3]+'</p>':'<div class="tag">'+s[0]+'</div><h2>'+s[1]+'</h2><p>'+s[3]+'</p>';if(s.includes('TABLE'))x+='<div class="table"><table><tr><th>Method</th><th>Search</th><th>Strength</th></tr><tr><td><strong>Grid Search</strong></td><td>All combinations</td><td>Exhaustive for small spaces</td></tr><tr><td><strong>Random Search</strong></td><td>Samples distributions</td><td>Broad coverage with budget</td></tr><tr><td><strong>Bayesian Optimization</strong></td><td>Uses prior trials</td><td>Sample-efficient for costly runs</td></tr></table></div>';else if(s.includes('FORMULA'))x+='<div class="formula">P(at least one good configuration) = 1 − (1 − p)<sup>n</sup></div>';else{let c=s.slice(hero?4:4).filter(z=>z&&z!=='TABLE'&&z!=='FORMULA');if(c.length)x+='<div class="grid">'+c.map(z=>{let a=z.split('|');return '<div class="item"><strong>'+a[0]+'</strong><p>'+a[1]+'</p></div>'}).join('')+'</div>'}x+='</article></section>';document.getElementById('deck').innerHTML=x;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / '+String(data().length).padStart(2,'0');document.getElementById('bar').style.width=((i+1)/data().length*100)+'%'}function next(){i=(i+1)%data().length;render()}function prev(){i=(i-1+data().length)%data().length;render()}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('home').onclick=()=>{i=0;render()};document.getElementById('lang').onclick=()=>{language=language==='en'?'pt':'en';render()};addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();prev()}if(e.key==='Home'){i=0;render()}});document.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(start===null)return;let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)d<0?next():prev();start=null},{passive:true});render();</script></body></html>
