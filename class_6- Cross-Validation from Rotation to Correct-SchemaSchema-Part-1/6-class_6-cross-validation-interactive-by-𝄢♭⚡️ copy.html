(function(){var idx=0,lang='en',theme='dark',round=0,guess=null,timer,startX=0;var T={en:{brand:'Cross-Validation',course:'Class 06 · Data Science 1',back:'Back',next:'Next',restart:'Restart',exit:'Exit',theme:'Toggle light/dark mode',full:'Fullscreen',hint:'← → navigate · swipe · F fullscreen · Home restart',r:'Round',train:'Train',val:'Val.',advance:'Reveal next fold',focus:'Validation fold',interactive:'INTERACTIVE MOMENT',question:'Before revealing it: which fold will validate next?',predict:'Make a prediction, then reveal the next rotation.',correct:'Correct — that fold is the next validation fold.',wrong:'Not this time — the highlighted gold fold is the next validation fold.',slides:[['PUC-SP · Data Science 1 · Class 06','Cross-validation: <span class="accent">from rotation</span> to the right scheme.','A visual, interactive explanation of stable evaluation, leakage prevention, and splitter selection that respects the real data structure.','“A reliable model does not rely on a lucky split: it proves consistency across validation scenarios.”',['KFold','StratifiedKFold','GroupKFold','TimeSeriesSplit','Leakage-safe pipeline']],['01 · The problem','One split is a <span class="accent">gamble</span>.','The same model and development data can get different scores when only the random seed changes. Cross-validation replaces one fragile number with a distribution of evidence.'],['02 · Core mechanism','See the <span class="green">k-fold rotation</span> happen.','The gold validation block moves from Fold 1 to Fold 5. Each round trains on k−1 folds, validates on one untouched fold, and adds a score to the final estimate.',['Partition the development data into k folds.','One fold is held out for validation; the remaining k−1 folds train.','Rotate until every fold has been validation exactly once.','Summarize all fold scores with mean ± standard deviation.']],['03 · Honest reporting','Report <span class="accent">mean ± standard deviation</span>.','The mean estimates expected performance; standard deviation reveals how much that estimate varies across folds.'],['04 · Right scheme','The splitter must respect the <span class="green">data structure</span>.','The correct validation scheme imitates the prediction scenario and prevents artificial optimism.'],['05 · Rare classes','Stratification distributes — it does <span class="accent">not create</span> examples.',''],['06 · Entity leakage','GroupKFold prevents the model from <span class="accent">memorizing people</span>.','Repeated records from the same patient, customer, or device must stay on one side of a split.'],['07 · Time order','The future cannot train the <span class="green">past</span>.','TimeSeriesSplit advances the evaluation boundary: train on history, validate on the future.'],['08 · Leakage-safe pipeline','Everything that learns from data stays <span class="accent">inside</span> the pipeline.','Scaling, imputation, and feature selection must be learned only from the training fold in each round.'],['09 · Protected test','Cross-validation chooses. The <span class="accent">final test</span> confirms.','The test set stays locked while decisions are made. It is evaluated once, after the full workflow is chosen.'],['10 · Lab evidence','The notebook confirms the theory <span class="green">in practice</span>.','The mean matched for k=5 and k=10 in this lab, while fold dispersion differed. k balances cost, data use, and stability.'],['11 · Evaluation flow','From raw data to the number that matters.',''],['12 · Responsible AI','Good evaluation is part of <span class="accent">responsible AI</span>.',''],['Closing','Do not ask only “what was the accuracy?”.','Ask on which splits, under which separation rule, without which leakage, and with what variation. That is the difference between a pretty metric and a trustworthy result.']],metrics:[['Lowest accuracy','0.8750','One possible split'],['Highest accuracy','0.9219','Same model and data'],['Mean across 5 seeds','0.8906','Center of variation'],['Standard deviation','0.0171','Observed uncertainty']],report:[['Five fold scores','0.9063 · 0.9063 · 0.8906 · 0.8750 · 0.8906','Evidence, not one guess'],['5-fold estimate','0.8938 ± 0.0117','Stable estimate'],['Interpretation','High mean · low variation','Consistent across folds']],schemes:[['Classification','StratifiedKFold','Preserves class proportions in each fold.'],['Regression / independent rows','KFold','Simple rotation works when there are no special dependencies.'],['Repeated entity records','GroupKFold','Keeps the same person, store, or device out of both sides.'],['Time-ordered data','TimeSeriesSplit','Trains on past observations and validates on future observations.'],['Very small datasets','LOO / Repeated CV','Uses samples intensely, with computation and variability trade-offs.']]},pt:{brand:'Validação Cruzada',course:'Aula 06 · Ciência de Dados 1',back:'Voltar',next:'Avançar',restart:'Reiniciar',exit:'Sair',theme:'Alternar modo claro/escuro',full:'Tela cheia',hint:'← → navegar · deslize · F tela cheia · Home reiniciar',r:'Rodada',train:'Treino',val:'Val.',advance:'Revelar próxima dobra',focus:'Dobra de validação',interactive:'MOMENTO INTERATIVO',question:'Antes de revelar: qual dobra será a próxima validação?',predict:'Faça sua previsão e depois revele a próxima rotação.',correct:'Correto — essa é a próxima dobra de validação.',wrong:'Ainda não — a dobra dourada destacada é a próxima validação.',slides:[['PUC-SP · Ciência de Dados 1 · Aula 06','Validação cruzada: <span class="accent">do rodízio</span> ao esquema certo.','Uma explicação visual e interativa sobre avaliação estável, prevenção de vazamento e escolha do splitter que respeita a estrutura real dos dados.','“Um modelo confiável não depende de um corte de sorte: ele prova consistência em vários cenários de validação.”',['KFold','StratifiedKFold','GroupKFold','TimeSeriesSplit','Pipeline seguro']],['01 · O problema','Um corte só é uma <span class="accent">aposta</span>.','O mesmo modelo e os mesmos dados de desenvolvimento podem receber notas diferentes quando apenas a seed muda. A validação cruzada troca um número frágil por uma distribuição de evidências.'],['02 · Mecânica central','Veja o <span class="green">rodízio k-fold</span> acontecer.','O bloco dourado de validação se move da Dobra 1 à Dobra 5. Cada rodada treina em k−1 dobras, valida em uma dobra inédita e adiciona uma nota à estimativa final.',['Particione os dados de desenvolvimento em k dobras.','Uma dobra fica reservada para validação; as outras k−1 treinam.','Gire até que cada dobra tenha sido validação exatamente uma vez.','Resuma as notas com média ± desvio-padrão.']],['03 · Reporte honesto','Reporte <span class="accent">média ± desvio-padrão</span>.','A média estima o desempenho esperado; o desvio-padrão revela quanto essa estimativa varia entre as dobras.'],['04 · Esquema correto','O splitter deve respeitar a <span class="green">estrutura do dado</span>.','O esquema correto imita o cenário de previsão e evita otimismo artificial.'],['05 · Classes raras','Estratificar distribui — <span class="accent">não cria</span> exemplos.',''],['06 · Vazamento por entidade','GroupKFold impede o modelo de <span class="accent">decorar pessoas</span>.','Registros repetidos do mesmo paciente, cliente ou dispositivo devem ficar de apenas um lado do corte.'],['07 · Ordem temporal','O futuro não pode treinar o <span class="green">passado</span>.','TimeSeriesSplit desloca a fronteira de avaliação: treina no histórico e valida no futuro.'],['08 · Pipeline seguro','Tudo que aprende com dados fica <span class="accent">dentro</span> do pipeline.','Padronização, imputação e seleção de atributos devem aprender somente com o treino de cada rodada.'],['09 · Teste protegido','A validação cruzada escolhe. O <span class="accent">teste final</span> confirma.','O teste permanece bloqueado enquanto as decisões são tomadas. Ele é avaliado uma única vez após a escolha do workflow completo.'],['10 · Evidência do laboratório','O notebook confirma a teoria <span class="green">na prática</span>.','A média foi igual para k=5 e k=10 neste laboratório, mas a dispersão entre dobras mudou. k equilibra custo, uso dos dados e estabilidade.'],['11 · Fluxo de avaliação','Da base ao número que vale.',''],['12 · IA responsável','Avaliar bem é parte da <span class="accent">IA responsável</span>.',''],['Encerramento','Não pergunte somente “qual foi a acurácia?”.','Pergunte em quais cortes, sob qual regra de separação, sem qual vazamento e com qual variação. Essa é a diferença entre uma métrica bonita e um resultado confiável.']],metrics:[['Menor acurácia','0.8750','Uma divisão possível'],['Maior acurácia','0.9219','Mesmo modelo e dados'],['Média de 5 seeds','0.8906','Centro da variação'],['Desvio-padrão','0.0171','Incerteza observada']],report:[['Cinco notas das dobras','0.9063 · 0.9063 · 0.8906 · 0.8750 · 0.8906','Evidência, não um palpite'],['Estimativa 5-fold','0.8938 ± 0.0117','Estimativa estável'],['Leitura','Média alta · baixa oscilação','Consistência entre dobras']],schemes:[['Classificação','StratifiedKFold','Preserva a proporção das classes em cada dobra.'],['Regressão / linhas independentes','KFold','O rodízio simples funciona quando não há dependências especiais.'],['Registros repetidos por entidade','GroupKFold','Mantém a mesma pessoa, loja ou sensor fora dos dois lados.'],['Dados ordenados no tempo','TimeSeriesSplit','Treina em observações do passado e valida em observações do futuro.'],['Dados muito pequenos','LOO / Repeated CV','Aproveita os exemplos intensamente, com trade-offs de custo e variabilidade.']]}};function icon(n){var d={shield:'<path d="M12 22s8-3.8 8-10V5l-8-3-8 3v7c0 6.2 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-6h6v6"/>',full:'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>',theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M ').join('')+'</div></div><div class="orb"></div></div></div>';if(idx===1)return '<div class="two"><div>'+head(s)+'</div><div class="metrics">'+t.metrics.map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div></div>';if(idx===2)return '<div class="fold-layout"><div>'+head(s)+'<div class="steps">'+s[3].map((x,i)=>'<div class="step"><div class="step-n">0'+(i+1)+'</div><p>'+x+'</p></div>').join('')+'</div></div><div id="board"></div></div>';if(idx===3)return '<div>'+head(s)+'<div class="results">'+t.report.map(x=>'<div class="result"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div><div class="note">'+(en?'Mean = sum of k scores ÷ k. Standard deviation reveals the dispersion between rounds.':'Média = soma das k notas ÷ k. O desvio-padrão revela a dispersão entre rodadas.')+'</div></div>';if(idx===4)return '<div>'+head(s)+'<div class="table"><div class="tr head"><b>'+(en?'Situation':'Situação')+'</b><b>'+(en?'Scheme':'Esquema')+'</b><b>'+(en?'Why':'Por que')+'</b></div>'+t.schemes.map(x=>'<div class="tr"><b>'+x[0]+'</b><div class="tag">'+x[1]+'</div><span>'+x[2]+'</span></div>').join('')+'</div></div>';if(idx===5)return '<div>'+head(s)+'<div class="compare"><div class="card"><h3>'+(en?'Random KFold':'KFold aleatório')+'</h3><p>'+(en?'Positive cases may concentrate in a few folds; a fold with zero positives makes some metrics meaningless.':'Casos positivos podem se concentrar em poucas dobras; uma dobra sem positivos torna algumas métricas sem sentido.')+'</p><div class="minifolds"><i style="--h:80%"></i><i style="--h:0%"></i><i style="--h:60%"></i><i style="--h:20%"></i><i style="--h:40%"></i></div></div><div class="card"><h3>StratifiedKFold</h3><p>'+(en?'Class prevalence is distributed across folds, giving every round a comparable validation scenario.':'A prevalência da classe é distribuída entre dobras, dando a cada rodada um cenário comparável.')+'</p><div class="minifolds"><i style="--h:56%"></i><i style="--h:56%"></i><i style="--h:56%"></i><i style="--h:56%"></i><i style="--h:56%"></i></div></div></div><div class="note">'+(en?'Rule of thumb: k ≤ number of examples in the rarest class.':'Regra de bolso: k ≤ número de exemplos da classe mais rara.')+'</div></div>';if(idx===6)return '<div>'+head(s)+'<div class="group-diagram"><div class="scenario bad"><h3>'+(en?'Wrong: P1 leaks':'Errado: P1 vaza')+'</h3><div class="patient-grid"><div class="patient bad">P1 · '+t.train+'</div><div class="patient bad">P1 · '+t.val+'</div><div class="patient">P2</div><div class="patient">P3</div><div class="patient">P4</div></div><p>'+(en?'The model recognizes the patient rather than learning the true pattern.':'O modelo reconhece o paciente em vez de aprender o padrão real.')+'</p></div><div class="scenario good"><h3>'+(en?'Correct: whole group':'Correto: grupo inteiro')+'</h3><div class="patient-grid"><div class="patient good">P1 · '+t.val+'</div><div class="patient">P2 · '+t.train+'</div><div class="patient">P3 · '+t.train+'</div><div class="patient">P4 · '+t.train+'</div><div class="patient">P5 · '+t.train+'</div></div><p>'+(en?'GroupKFold keeps all records of one entity on a single side.':'GroupKFold mantém todos os registros da entidade em um único lado.')+'</p></div></div></div>';if(idx===7)return '<div>'+head(s)+'<div class="timeline">'+[2,3,4,5].map((cut,i)=>'<div class="time-row"><label>'+t.r+' '+(i+1)+'</label><div class="timecells">'+Array.from({length:8},(_,j)=>'<i class="'+(j===cut?'future':j>cut?'off':'')+'"></i>').join('')+'</div></div>').join('')+'</div><div class="note">'+(en?'Gold = future validation. Green = known past. The gold window always remains to the right.':'Dourado = validação futura. Verde = passado conhecido. A janela dourada permanece à direita.')+'</div></div>';if(idx===8)return '<div>'+head(s)+'<div class="pipeline">'+(en?[['Training fold','Only training rows'],['Scaler','Fit on training'],['Feature selection','No validation access'],['Model','Fit estimator'],['Validation','Score unseen fold']]:[['Dobra de treino','Somente linhas de treino'],['Scaler','Fit no treino'],['Seleção','Sem acesso à validação'],['Modelo','Ajuste o estimador'],['Validação','Nota da dobra inédita']]).map(x=>'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div></div>';if(idx===9)return '<div>'+head(s)+'<div class="test-flow"><div class="flow-box"><b>'+(en?'Development data':'Dados de desenvolvimento')+'</b><span>'+(en?'Cross-validation selects the workflow.':'A validação cruzada seleciona o workflow.')+'</span></div><div class="arrow"></div><div class="flow-box"><b>'+(en?'Final workflow':'Workflow final')+'</b><span>'+(en?'Retrain using all development data.':'Retreine usando todos os dados de desenvolvimento.')+'</span></div><div class="arrow"></div><div class="flow-box lock"><b>🔒 '+(en?'Final test':'Teste final')+'</b><span>'+(en?'Use once to confirm generalization.':'Use uma vez para confirmar a generalização.')+'</span></div></div></div>';if(idx===10)return '<div>'+head(s)+'<div class="results"><div class="result"><span>'+(en?'Data split':'Divisão dos dados')+'</span><b>320 dev · 80 '+(en?'test':'teste')+'</b><small>8 '+(en?'features':'atributos')+' · 34 '+(en?'positives':'positivos')+'</small></div><div class="result"><span>K = 5</span><b>0.8938 ± 0.0117</b><small>5 '+(en?'training runs':'treinamentos')+'</small></div><div class="result"><span>K = 10</span><b>0.8938 ± 0.0286</b><small>10 '+(en?'training runs':'treinamentos')+'</small></div></div><p class="lead">'+s[2]+'</p></div>';if(idx===11)return '<div>'+head(s)+'<div class="pipeline">'+(en?[['Raw data','Features + target'],['Final test','Separated & locked'],['CV on dev','Choose splitter'],['Final pipeline','Train on all dev'],['Test once','Generalization result']]:[['Dados brutos','Features + alvo'],['Teste final','Separado e bloqueado'],['CV no dev','Escolha o splitter'],['Pipeline final','Treino em todo dev'],['Teste uma vez','Resultado de generalização']]).map(x=>'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div></div>';if(idx===12)return '<div>'+head(s)+'<div class="compare">'+(en?[['Risks avoided','Data leakage, inflated scores, and unrepresentative validation.'],['Limitations','CV increases cost and cannot replace a representative final test.'],['Scalability','Choose k pragmatically and parallelize when appropriate.'],['Production evolution','Monitor drift; use Nested CV for extensive tuning.']]:[['Riscos evitados','Vazamento de dados, notas infladas e validação pouco representativa.'],['Limitações','CV aumenta o custo e não substitui um teste final representativo.'],['Escalabilidade','Escolha k pragmaticamente e paralelize quando apropriado.'],['Evolução em produção','Monitore drift; use Nested CV para tuning extenso.']]).map(x=>'<div class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'</div></div>';return '<div class="closing"><div class="ring"><i></i></div><p class="eyebrow">'+s[0]+'</p><h2 class="title">'+s[1]+'</h2><p class="lead">'+s[2]+'</p></div>'}function render(){clearInterval(timer);document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;var t=T[lang];document.getElementById('app').innerHTML='<header class="top"><div class="brand"><div class="brand-mark">'+icon('shield')+'</div><div><b>'+t.brand+'</b><small>'+t.course+'</small></div></div><div class="tools"><div class="lang"><button id="en" class="'+(lang==='en'?'active':'')+'">EN</button><button id="pt" class="'+(lang==='pt'?'active':'')+'">PT</button></div><button id="theme" class="tool" aria-label="'+t.theme+'">'+icon('theme')+'</button><button id="full" class="tool" aria-label="'+t.full+'">'+icon('full')+'</button><button id="restart-top" class="tool" aria-label="'+t.restart+'">'+icon('restart')+'</button><button id="exit" class="tool" aria-label="'+t.exit+'">'+icon('exit')+'</button></div></header><section class="stage"><article class="slide">'+content()+'</article></section><footer class="bottom"><div class="progress-wrap"><div class="progress"><i style="width:'+((idx+1)/14*100)+'%"></i></div><span class="count">'+String(idx+1).padStart(2,'0')+' / 14</span></div><div class="nav-controls"><button id="back" class="nav-btn">'+icon('left')+'<span>'+t.back+'</span></button><button id="restart" class="nav-btn">'+icon('restart')+'<span>'+t.restart+'</span></button><button id="next" class="nav-btn primary"><span>'+t.next+'</span>'+icon('right')+'</button></div><div class="hint">'+t.hint+'</div><nav class="dots">'+Array.from({length:14},(_,i)=>'<button class="dot '+(i===idx?'active':'')+'" data-i="'+i+'"></button>').join('')+'</nav></footer>';var go=n=>{idx=Math.max(0,Math.min(13,n));render()};en.onclick=()=>{lang='en';render()};pt.onclick=()=>{lang='pt';render()};theme=document.getElementById('theme');theme.onclick=()=>{theme=undefined;window.theme=window.theme;};document.getElementById('theme').onclick=function(){window.__theme=window.__theme||'dark';theme=document.documentElement.dataset.theme==='dark'?'light':'dark';render()};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();document.getElementById('restart-top').onclick=()=>go(0);document.getElementById('exit').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();go(0)};document.getElementById('back').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('restart').onclick=()=>go(0);document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>go(+x.dataset.i));if(idx===2){var b=document.getElementById('board');function update(){b.innerHTML=board(t);document.getElementById('advance-round').onclick=function(){var target=(round+1)%5;var fb=document.getElementById('feedback');if(guess!==null){fb.textContent=guess===target?t.correct:t.wrong;fb.className='feedback '+(guess===target?'ok':'no')}round=target;guess=null;setTimeout(update,700)};document.querySelectorAll('[data-guess]').forEach(x=>x.onclick=function(){guess=+x.dataset.guess;update()})}update();timer=setInterval(function(){round=(round+1)%5;guess=null;update()},3800)}}function move(n){idx=Math.max(0,Math.min(13,idx+n));render()}window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key==='Home'){idx=0;render()}else if(e.key==='End'){idx=13;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}});document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{var d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:true});render()})();
